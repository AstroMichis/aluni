# XcodeGen spec. Generate the project with `xcodegen generate` from this folder;
# Aluni.xcodeproj is git-ignored and recreated from here.
name: Aluni
options:
  bundleIdPrefix: us.aluni
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  developmentLanguage: en
  knownRegions:
    - en
    - es

packages:
  HotwireNative:
    url: https://github.com/hotwired/hotwire-native-ios
    from: "1.2.0"

configFiles:
  Debug: Aluni/Config/Development.xcconfig
  Release: Aluni/Config/Production.xcconfig

targets:
  Aluni:
    type: application
    platform: iOS
    sources:
      - Aluni
    dependencies:
      - package: HotwireNative
    settings:
      base:
        INFOPLIST_FILE: Aluni/Supporting/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: us.aluni.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        # No DEVELOPMENT_TEAM here: Debug reads it from the git-ignored
        # Config/Local.xcconfig (included by Development.xcconfig), so a free
        # Personal Team can sign device builds without touching this file.
        # The paid team goes here when it exists.
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Info.plist is preprocessed so the local-network keys exist in Debug only.
        INFOPLIST_PREPROCESS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          INFOPLIST_PREPROCESSOR_DEFINITIONS: DEBUG=1
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
          # Associated domains (app links + passkeys) and push need a paid Apple
          # Developer team; Debug builds stay signable with a free personal team,
          # so the entitlements are Release-only.
          CODE_SIGN_ENTITLEMENTS: Aluni/Supporting/Aluni.Release.entitlements

schemes:
  Aluni:
    build:
      targets:
        Aluni: all
    run:
      config: Debug
    archive:
      config: Release
