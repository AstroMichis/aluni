# Scheduled jobs, loaded by config/initializers/sidekiq.rb. Cron runs in UTC
# (the app time zone is UTC too). Each class must use a queue listed in
# config/sidekiq.yml. Platform::CronControl disables every entry while the
# `cron` or `jobs` switch is paused and re-enables them on resume.
sessions_purge_stale:
  cron: "0 3 * * *"   # 03:00 UTC daily
  class: "Sessions::PurgeStaleJob"
  queue: maintenance
  description: "Delete sign-in sessions that have not been used for a year"

sign_in_codes_purge:
  cron: "30 3 * * *"   # 03:30 UTC daily
  class: "SignInCodes::PurgeJob"
  queue: maintenance
  description: "Delete sign-in codes and native hand-off tokens older than a day"

weather_daily_alerts:
  cron: "0 10 * * *"  # 10:00 UTC: early morning across the Americas
  class: "Weather::DailyAlertsJob"
  queue: default
  description: "Frost, heat, heavy rain and dry-spell alerts from the forecast, for the kinds each farmer chose"

observations_weekly_refresh:
  cron: "0 4 * * 1"   # Mondays 04:00 UTC
  class: "Fields::RefreshObservationsJob"
  args: ["weekly"]
  queue: maintenance
  description: "The season so far (NASA POWER) and the last year's NDVI for every located field"

observations_monthly_refresh:
  cron: "0 5 1 * *"   # the 1st of each month, 05:00 UTC
  class: "Fields::RefreshObservationsJob"
  args: ["monthly"]
  queue: maintenance
  description: "Every public source, including the AppEEARS products, for fields with month-old data"
