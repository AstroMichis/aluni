          why: "%{crop} is the best-suited crop of another family at your pin; strongest here: %{lead}."
        perennial:
          title: Rest with perennial forage
          why: 'Two years of %{crop} rebuild soil and feed animals; strongest here: %{lead}.'
      criteria:
        crop_fit:
          short: Crop fit
          how: FAO GAEZ suitability of each season's crop at your pin.
          benefit: The crops suit your land and climate better.
        pest_break:
          short: Pest break
          how: No crop family two seasons running, no crop three in a row.
          benefit: It breaks the cycle of pests and diseases.
        soil_health:
          short: Soil health
          how: Legumes, more families and crops that cover the soil.
          benefit: It builds soil and organic matter.
        nitrogen:
          short: Nitrogen
          how: Seasons with a legume, which fixes its own nitrogen.
          benefit: It needs less nitrogen fertilizer.
        water:
          short: Water
          how: How much of the crops' water need the usual rain covers (FAO-56, NASA POWER).
          benefit: It fits the rain you get better.
        erosion:
          short: Erosion
          how: Row crops on your slope leave soil exposed.
          benefit: It keeps soil in place.
        workload:
          short: Workload
          how: Fewer different crops and machinery you already have.
          benefit: It is simpler to run.
      evidence:
        suitability: "%{crop}: %{class} at your pin."
        water: "%{crop} needs about %{need} mm; the usual rain covers about %{effective} mm."
        slope: Slope of %{value} %.
        same_family: "%{crop} would follow its own family."
        monoculture: "%{crop} three seasons or more in a row."
        no_legume: No legume in four seasons.
      risks:
        dry: Rainfed, and the usual season rain is under half of what a crop needs. Check soil moisture and local experience.
        low_suitability: A crop has low suitability at your pin according to FAO GAEZ.
        harvester: Small grains need a combine; your equipment does not list one.
        same_family: Pests that live on one family could carry over.
        establishment: Alfalfa takes a season to establish and needs a market or animals.
        new_crop: It brings a crop your field has not grown before, and you prefer to change carefully. Try it on part of a field first.
        contract: You sell under contract or for export. Check with your buyer before changing the crop.
      gaps:
        market: 'Prices and buyers: there is no source for your local market yet.'
        soil: Your soil texture is not confirmed yet.
        ecocrop: The crops' temperature and pH requirements (FAO ECOCROP) are not loaded yet.
        suitability: FAO GAEZ has no value for some of these crops at your pin.
        water: The water need is only known for corn and soybeans so far (FAO-56).
        slope: The slope is not known outside the United States yet.
