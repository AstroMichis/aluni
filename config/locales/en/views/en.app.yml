        pest_break:
          short: Pest break
          how: No crop family two seasons running, no crop three in a row.
          benefit: It breaks the cycle of pests and diseases.
        soil_health:
          short: Soil health
          how: Legumes, more families and crops that cover the soil.
          benefit: It builds soil and organic matter.
        nitrogen:
          short: Nitrogen
          how: Seasons with a legume, which fixes its own nitrogen.
          benefit: It needs less nitrogen fertilizer.
        water:
          short: Water
          how: "How much of the crops' water need the usual rain covers (FAO-56, NASA GPM IMERG rain): a drought-risk guide, not a harvest forecast."
          benefit: It fits the rain you get better.
        erosion:
          short: Erosion
          how: Row crops on your slope, and under heavy rain, leave soil exposed.
          benefit: It keeps soil in place.
        workload:
          short: Workload
          how: Fewer different crops and machinery you already have.
          benefit: It is simpler to run.
