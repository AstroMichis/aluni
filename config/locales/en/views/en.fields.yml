    show:
      title: "%{name} · %{app_name}"
      empty_message: This field is ready. Tell me what you grow here and you will see it come up.
      add_crop: Add your crop
      repeat: Repeated
      tips:
        fallow: A resting field rebuilds soil. A cover crop now keeps it covered and adds organic matter for the next season.
        stalk: Alternating this crop with a legume breaks the pest cycle in the soil. A cover crop after harvest protects the ground through winter.
        grain: Small grains cover the soil early and break the pest cycle of corn and soybeans. Their straw adds organic matter.
        leafy: 'This crop fixes nitrogen: whatever you plant next uses it. Avoid repeating it two years in a row so diseases do not build up.'
        bush: These crops disturb the soil a lot. Rotating them with a grain or a cover crop helps it recover its structure.
      plant: Plant it
    new:
      title: Add a field · %{app_name}
      crumb: Add a field
      progress: Progress
      count: Step %{number} of %{total}
      why: We use it for %{uses}.
      back: Back
      next: Continue
      finish: See my fields
      looks_right: Looks right
      change: Change
      optional: You can skip this.
      history_prefilled: 'In the US we fill these years in from the crop map: just check they are right.'
      pick_crop: Choose a crop
      steps:
        location:
          question: Where is your farm?
          aluni: Drop a pin on the map. With that I can read the weather, the soil and the slope of your area without asking you about any of it.
        found:
          question: Here is what I found
          aluni: 'Check these values for your area. You know your land better than a satellite: if something does not match, change it.'
        boundary:
          question: What is this field like?
          aluni: Draw the outline if you can and I will work out the area. If not, the pin is enough and you tell me how big it is.
        crop:
          question: What is growing there now?
          aluni: 'What you grow today is the starting point: I compare other rotations against it.'
        history:
          question: What did you grow before?
          aluni: With the last three years I can see whether a crop family repeats, which is when pests build up the most.
        water:
          question: How do you water?
          aluni: That tells me how much water a crop can ask for before I suggest it.
        inputs:
          question: How much fertilizer do you use?
          aluni: A rough idea is enough. If you use little, legumes pay off more.
        resources:
          question: What do you have to work with?
          aluni: I will not suggest something you cannot plant or harvest with what you have.
        market:
          question: Where do you sell your harvest?
          aluni: A crop with no buyer is not a good option, however much it helps the soil.
        goals:
          question: What matters most to you?
          aluni: Choose up to three, in order. That is how I rank the options I show you.
        done:
          question: Check and save
          aluni: This is what you told me. Save it and I will set up your field.
