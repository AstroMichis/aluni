                  - ["Mechanics", "IP67 PC enclosure, M12 connectors, radiation shield (U-08)", "Yes", "Yes", "[UNKNOWN]", "[UNKNOWN]", "Not yet quoted"]
                  - ["PCB + assembly", "Custom 2/4-layer board (U-22)", "Yes", "Yes", "$8.00 + $0.0016/joint", "$8.00 + $0.0016/joint", "[VERIFIED: JLCPCB]; joint count [UNKNOWN]"]
                  - ["Priced core electronics subtotal", "MCU + secure element + SHT45 (Lite); + BG95-M3 + eSIM (Pro). Excludes probes, rain gauge, flash, RTC, power, enclosure and PCB", "Lite / Pro", "", "~$10.78 / ~$41.08", "~$8.78 / ~$34.14", "Computed from verified items [ASSUMPTION A-3]"]
            - p: "Optional SDI-12 / RS485 expansion sensors [DESIGN]: soil electrical conductivity (TEROS 12, $258.00) and leaf wetness for fungal-disease models (PHYTOS 31, $164.00), both at METER 2025 fellowship-sheet prices [VERIFIED: METER 2025 fellowship sheet]. The solar radiation sensor SKU for the Pro remains [UNKNOWN] (U-21)."
            - lead: { b: "BOM sensitivity:", t: "the priced core electronics are inexpensive (~$8.78 Lite and ~$34.14 Pro at Qty 100, of which the BG95-M3 module is ~$24.66). External transducers dominate: two research-grade soil probes alone (~$436 at the benchmark price) would exceed the whole priced core of either variant, and the rain gauge benchmark ($150.00) is more than four times the Pro core. Choosing between an industrial capacitive probe and a research-grade probe is therefore the main hardware trade-off before EVT (U-07)." }
            - h3: "5. Firmware security, backend ingestion and engineering estimates"
            - lead: { b: "Hardware-rooted identity and firmware safety [VERIFIED: docs/DEVICES.md]:", t: "each unit generates its private key inside the ATECC608B during factory enrolment, and the key never leaves the chip. Every batch is signed with ECDSA P-256; the backend rejects duplicate seq values and clock skew above 10 minutes. Firmware enforces secure boot, flash encryption and signed A/B OTA updates with automatic rollback." }
            - lead: { b: "Backend ingestion and UI integration (to build) [VERIFIED: docs/DEVICES.md]:", t: "dedicated endpoint POST /api/v1/devices/readings feeding the devices and device_readings tables; non-destructive range validation (out-of-range values are flagged, not dropped); rate limiting with Rack::Attack; an operator pause switch in the Integrations Hub; and a field-workspace device card with battery and signal health, threshold alerts and the \"Your sensor next to the satellite\" charts." }
            - lead: { b: "Cellular payload and connectivity cost [ASSUMPTION A-1]:", t: "4 readings/hour × 24 h × 30 days = 2,880 readings/month (~720 hourly batches). A compact JSON/CBOR payload (~180 bytes/reading plus TLS overhead) is expected to stay under 1–2 MB/month if TLS sessions are resumed between uploads; the model uses 5 MB/month to cover full handshakes, OTA checks and retries. At 5 MB/month, Telnyx ($0.70 one-time eSIM, $0.00/month platform fee, $0.078/MB) costs ~$0.39/month versus Hologram ($3.00 SIM, $1.00/month, $0.03/MB) at ~$1.15/month [VERIFIED: Telnyx and Hologram pricing]. Excluding one-time SIM costs, Telnyx stays cheaper up to ~21 MB/month per device. Per-country tariffs, roaming restrictions and LTE-M/NB-IoT availability in each target market are [UNKNOWN] (U-09, U-10)." }
            - lead: { b: "Energy budget envelope [ASSUMPTION A-2]:", t: "the MCU spends more than 98% of the time in deep sleep, waking ~1–2 s every 15 minutes for sensing and ~5–10 s per hour for the radio upload. With a 3.2 V / 6,000 mAh LiFePO4 cell (~19.2 Wh nominal) and a 5 W panel, an estimated consumption of ~0.3–0.6 Wh/day gives a conservative autonomy of more than 15–20 days without sun (after derating for cold, ageing and depth of discharge) and recovers a day's use in under one hour of peak sun. Because deployments will span all climate zones, the charger must block LiFePO4 charging below 0 °C and the power design must be checked against high-latitude winter irradiance and hot-climate enclosure temperatures [DESIGN]. All figures are to be measured on EVT units (U-08)." }
            - h3: "6. Manufacturing path [DESIGN]"
            - table:
                caption: "Manufacturing gates"
                rows:
                  - ["Gate", "Units", "Build", "Exit criteria"]
                  - ["EVT · Engineering Validation Test", "10", "Commercial development boards (ESP32-S3 and BG95-M3) in a standard IP67 enclosure with candidate soil probes", "Store-and-forward firmware loop validated; power draw measured; 60-day pairing against SMAP and IMERG on pilot fields in at least two contrasting agro-climatic regions (O5)"]
                  - ["DVT · Design Validation Test", "20–30", "Custom PCB through turnkey PCBA; final UV-stabilised enclosure and M12 connectors", "Full-season field deployment; soil-texture calibration curves indexed by Field.soil.texture covering the main soil classes of target markets (open design item in docs/DEVICES.md)"]
                  - ["Certification and PVT · Production Validation Test", "100 (pilot batch)", "Per-unit factory provisioning: flash firmware with secure boot → ATECC608B internal key generation → register public key in %{app_name}'s devices table [VERIFIED: docs/DEVICES.md] → print and apply QR claim label → thermal burn-in and IP67 water-ingress test → pack", "Repeatable yield; units ready for market-specific certification and shipment"]
            - lead: { b: "Make-vs-buy gates:", t: "off-the-shelf versus custom enclosures and probes are re-evaluated at each gate [VERIFIED: docs/DEVICES.md]." }
            - h3: "7. Regulatory certification path (global, module-based)"
            - p: "Using pre-certified radio modules (ESP32-S3-WROOM-1 and Quectel BG95-M3) lets the Sonda reuse existing module approvals in many markets, so that the host product needs a lighter declaration and EMC assessment instead of full end-device radio certification [DESIGN]. Each destination market (or regional bloc) has its own type-approval regime, and which module approvals are recognized in each target market is [UNKNOWN] (U-09, U-10). The only market costed so far is the United States, used here as a reference benchmark:"
            - table:
                caption: "Certification paths, United States as the reference benchmark"
                rows:
                  - ["Certification path", "Applicability", "Benchmark cost (USD)", "Benchmark lead time", "Evidence"]
                  - ["Host declaration reusing pre-certified module approvals", "Sonda Lite; Sonda Pro if the BG95-M3 approval covers the host design", "$2,500 – $5,500", "3 – 6 weeks", "[VERIFIED (secondary): MarkReady] (US FCC SDoC); other markets [UNKNOWN] (U-10)"]
                  - ["Cellular IoT EMC / radio testing", "Sonda Pro if the host board or antenna needs a full radio test", "$15,000 – $40,000", "8 – 16 weeks", "[VERIFIED (secondary): MarkReady] (US); other markets [UNKNOWN] (U-10)"]
                  - ["Full cellular end-device + industry certification + operator approval", "Sonda Pro only if mobile operators require end-device certification", "$50,000 – $200,000", "6 – 9 months", "[VERIFIED (secondary): MarkReady] (US, PTCRB route); other markets [UNKNOWN] (U-10)"]
            - lead: { b: "Gated rollout strategy [DESIGN]:", t: "Sonda Lite ships first because it relies only on a WiFi/BLE module and stays on the cheapest, fastest certification route in each market. Sonda Pro follows market by market once module manufacturer and test-lab consultations confirm BG95-M3 approval coverage (U-09), national type-approval requirements (U-10) and LTE-M/NB-IoT network availability in each target market." }
        t5c:
          title: "T5c · How %{app_name} decides: use cases, formulas and a worked example on real data"
          blocks:
            - p: "Every recommendation %{app_name} makes is a deterministic calculation on public data, and it can be reproduced line by line. The formulas below are copied from the production services. They were run on a real field: the team's captured dataset for Ames, Iowa (42.0, −93.75), with NASA POWER daily data for 1 Jan–31 Oct 2025 (304 days), plus SSURGO soil, USGS 3DEP slope and the USDA Cropland Data Layer [VERIFIED: farm_data_42.0_-93.75.csv / .json in the repo]."
            - h3: "Use cases: problem → data → calculation → farmer decision"
            - table:
                caption: "Use cases"
                rows:
                  - ["Farm problem", "Data source (NASA first)", "Calculation in %{app_name}", "What the farmer decides"]
                  - ["Will rain cover this crop's water need?", "NASA POWER (T2M, RH2M, WS2M, ALLSKY_SFC_SW_DWN, PRECTOTCORR); FAO-56 Kc", "Weather::Et0 (Penman-Monteith) → Crops::WaterNeed (Kc curve, CROPWAT effective rain) → water score", "Which crop fits rainfed; whether to irrigate"]
                  - ["Will bare soil wash away?", "GPM IMERG 20-year daily rain; USGS 3DEP or NASADEM slope", "Weather::RainExtremes (25/50 mm days) → erosion score; Rotations::Timeline storm months", "Rotation with fewer row crops on slopes; cover crop timing"]
                  - ["When is the soil bare and exposed?", "Landsat + Sentinel-2 NDVI; MODIS 20-year normal; POWER frost days", "Fields::Vegetation, Rotations::Timeline (bare month under storm, dry or frost)", "Cover crop and sowing window"]
                  - ["Is irrigation water secure?", "GRACE/GRACE-FO water storage; SMAP L4 root-zone moisture; ECOSTRESS ESI", "Weather::WaterStorage (−15 water points when depleted), Weather::SoilMoisture, Weather::WaterStress", "Reduce irrigated area; choose drought-tolerant crops"]
                  - ["Is the crop suited to this pin and soil?", "FAO GAEZ v4; FAO ECOCROP; SSURGO", "Crops::Potential, Crops::Fit (−20 points per soil property outside tolerance)", "Drop unsuitable crops"]
                  - ["Does the rotation break pests and build nitrogen?", "USDA CDL crop history; crop families", "Crops::RotationCheck (same family, monoculture, no legume in 4 seasons)", "Insert a legume or another family"]
                  - ["Frost, heat, storm this week", "Meteomatics 7-day; POWER", "Weather::Forecast, Weather::DailyAlertsJob", "Delay sowing, protect, harvest early"]
                  - ["What will the plan cost and earn (vision)", "FAOSTAT, USDA AMS/NASS, WFP, World Bank (licence verdicts recorded)", "Module 9: cost per ha + price → gross margin", "Pick the strategy that pays"]
            - p: "Sources for the calculations column: [VERIFIED: app/services/weather/et0.rb, crops/water_need.rb, rotations/comparator.rb, rotations/timeline.rb, weather/rain_extremes.rb; docs/FIELDS.md; docs/DATA_SOURCES.md]."
            - h3: "The formulas (as implemented)"
            - p: "1. Reference evapotranspiration, FAO-56 Penman-Monteith (Weather::Et0):"
            - formula: "ET0 = [0.408 Δ Rn + γ (900 / (T + 273)) u2 (es − ea)] / [Δ + γ (1 + 0.34 u2)]"
            - p: "Here Rn = 0.77 Rs − Rnl; Rs comes from ALLSKY_SFC_SW_DWN, γ = 0.000665 P, and P is set by elevation."
            - p: "2. Crop water need over the FAO-56 stages (Crops::WaterNeed). Kc is flat, rises, holds, then falls:"
            - formula: "ETc = Σ (d = 1 to L) Kc(d) × ET0(d)"
            - p: "3. Effective rain per month, FAO/CROPWAT (Smith 1992):"
            - formula: "Pe = 0.8 P − 25 when P > 75 mm; Pe = max(0.6 P − 10, 0) when P ≤ 75 mm"
            - p: "4. Water score (rainfed): 100 × the mean of Pe/ETc over the strategy's crops. Season totals let a wet month hide a dry one: sunflower is 91% covered by the season total but 80% month by month. Irrigated: 60 + 40 × that share − 15 when GRACE shows the regional store depleted."
            - p: "5. Erosion score: 100 − (row crops × penalty). The penalty is 25 on slopes of 5% or more, else 8, plus 7 where 50 mm days come at least once a year (IMERG)."
            - p: "6. Soil health = min(100, 25 + 20 × legumes + 10 × families + 10 × non-row crops). Nitrogen = 100 × legume seasons / seasons. Pest break = 100 − 25 × same-family pairs − 30 × monoculture runs. Workload = 100 − 15 × (distinct crops − 1) − 20 for small grains without a harvester."
            - p: "7. Total, weighted by the farmer's goals (weight 3 for a criterion that matches a goal, else 1):"
            - formula: "S = Σc (wc × sc) / Σc wc, with wc ∈ {1, 3}"
            - p: "8. Exposed month (Rotations::Timeline): a month with no crop in the ground whose 20-year IMERG mean is at least one heavy-rain day a year (storm), rain under half of ET0 (dry), or ≥2 frost days. A cover crop protects every month of a bare window of 2+ months except the first."
            - h3: "Worked example: Ames, Iowa, 2025 season"
            - lead: { b: "Field inputs [VERIFIED: repo dataset]:", t: "elevation 321.7 m; slope 4.05% (USGS 3DEP); Clarion loam, well drained, 3.5% organic matter, available water capacity 0.21 cm/cm (SSURGO). CDL history: soybeans 2020, 2022, 2024; corn 2021, 2023, 2025. Profile and goals as in the team's Nebraska demo farm (rotation + soil health; owns a harvester) [VERIFIED: config/demo_farms.yml]." }
            - lead: { b: "Method note.", t: "Production uses 25-year POWER normals and 20 years of IMERG. This example uses the 2025 daily series actually captured, so it shows one real season. Wind is not in the file, so each day's NASA POWER WS2M at the pin is used (mean 3.15 m/s in 2025; the FAO-56 default of 2 m/s understated it). Heavy-rain days come from POWER rain here, not IMERG. Every number comes from docs/proposal/ames_worked_example.rb (run mise exec -- ruby docs/proposal/ames_worked_example.rb). It writes ames_worked_example_out.json, lists every gap it does not fill, and exits with an error if any of its 24 checks fails." }
            - table:
                caption: "Monthly weather, 2025 (computed)"
                rows:
                  - ["Month", "ET0 (mm)", "Rain (mm)", "Frost days", "Days ≥ 25 mm", "Risk flags (timeline rule)"]
                  - ["Jan", "18.1", "7.0", "31", "0", "dry, frost"]
                  - ["Feb", "25.4", "10.0", "26", "0", "dry, frost"]
                  - ["Mar", "67.2", "66.7", "22", "1", "storm, frost"]
                  - ["Apr", "86.6", "89.8", "7", "1", "storm, frost"]
                  - ["May", "127.0", "75.8", "0", "1", "storm"]
                  - ["Jun", "132.3", "187.4", "0", "2", "storm"]
                  - ["Jul", "138.7", "236.0", "0", "3", "storm"]
                  - ["Aug", "114.1", "82.6", "0", "0", "–"]
                  - ["Sep", "94.5", "39.9", "0", "0", "dry"]
                  - ["Oct", "76.8", "59.1", "0", "0", "–"]
            - p: "Jan–Oct totals: ET0 881 mm, rain 854 mm. Last spring frost: 8 Apr; no fall frost by 31 Oct. Growing degree days (base 10 °C, 86/50 method, May–Sep): 1,702; the landing page's 1,915 is the simple method (daily mean − 10 °C) over Jan–Oct. Wettest day: 46.8 mm (May), so there were no 50 mm days and no storm penalty."
            - table:
                caption: "Crop water balance, 2025 (Crops::WaterNeed algorithm)"
                rows:
                  - ["Crop (FAO-56 season)", "ETc need (mm)", "Season rain (mm)", "Effective rain (mm)", "Deficit (mm)", "Covered by rain"]
                  - ["Corn, 1 Apr–28 Aug", "506", "663", "408", "119", "80%"]
                  - ["Soybean, 1 May–12 Sep", "499", "588", "365", "138", "73%"]
                  - ["Spring wheat, 1 Mar–13 Jul", "428", "508", "297", "165", "69%"]
                  - ["Sunflower, 1 Apr–8 Aug", "418", "610", "382", "83", "91%"]
            - table:
                caption: "Strategy scores (Rotations::Comparator; crop fit left out because GAEZ is not in this dataset, exactly as the app does when a criterion is missing)"
                rows:
                  - ["Strategy (next 3 seasons)", "Pest break ×3", "Soil health ×3", "Nitrogen ×3", "Water ×1", "Erosion ×3", "Workload ×1", "Total"]
                  - ["Current: soybean → corn → soybean", "100", "85", "67", "76", "76", "85", "82"]
                  - ["Small grain: wheat → soybean → corn", "75", "75", "33", "74", "84", "70", "68"]
                  - ["Other family: sunflower → corn → sunflower", "100", "45", "0", "88", "76", "85", "60"]
            - table:
                caption: "Bare and exposed months, 2025 weather (Jan–Oct)"
                rows:
                  - ["Strategy, seasons 2026–2028 (Jan–Oct known; Nov–Dec have no data)", "Vulnerable months, FAO-56 seasons", "With cover", "Vulnerable, corn on the farmer's Apr–Oct record", "With cover"]
                  - ["Current: soybean → corn → soybean", "12", "4", "11", "3"]
                  - ["Small grain: wheat → soybean → corn", "11", "4", "10", "3"]
                  - ["Other family: sunflower → corn → sunflower", "12", "6", "11", "5"]
            - p: "Source: timeline.lines in docs/proposal/ames_worked_example_out.json. A cover protects every month of a bare window except the first. Unknown months break a window, so these counts are low: November and December were open soil in all 26 clear satellite views of 2013-2025 (T5d, V8)."
            - lead: { b: "What this shows.", t: "On this field %{app_name} does not push change for its own sake: the current corn–soybean rotation scores highest (82). That agrees with 670 field trials of maize after soybean in a climate like Ames (+9.9%, T5d V4) and with what the farmer has grown since at least 2008 (CDL). The data flags 12 vulnerable bare months over the next three seasons on the FAO-56 calendar, under frost, drought or the 25 mm storms of March–July. A cover crop in each bare window cuts the count to 4, but the soil it saves is about 13% (RUSLE, T5d V6): the riskiest months are May and June under young crops, which the month count treats as covered. This is one season of model output, checked against the app's code (below) and against 25 years of records (T5d)." }
            - lead: { b: "The same formulas in Buin, Chile (demo farm, canal-irrigated).", t: "GRACE shows the region's water store about 20 cm below its 2004–2009 level [VERIFIED: docs/DEMO.md]. Because the field draws on canals, irrigation_risk takes 15 points off the water score of every strategy, and the plan flags \"water storage\" as a risk to check locally [VERIFIED: comparator.rb, SUPPLY_RISK = 15]." }
            - h3: "Cross-check: the app's own services give the same answer"
            - p: "docs/proposal/ames_cross_check.rb feeds the same 2025 data, as monthly means, into the production Weather::Et0.monthly, Crops::WaterNeed and Crops::RotationCheck. Run on 15 Nov 2026 with mise exec -- bin/rails runner docs/proposal/ames_cross_check.rb in the project's own environment. It now also totals the strategies with the app's own water shares:"
            - table:
                caption: "Cross-check against the production services"
                rows:
                  - ["Check", "App services", "Worked example", "Result"]
                  - ["ET0, Jun–Aug", "129.3 / 138.0 / 114.7 mm", "132.3 / 138.7 / 114.1 mm", "App 0.5% higher to 2.3% lower"]
                  - ["ET0, Jan–Feb", "16.1 / 21.6 mm", "18.1 / 25.4 mm", "App 11–15% lower: monthly means lose the daily Tmax/Tmin spread, as the script header predicts"]
                  - ["Corn ETc / effective rain / deficit", "497 / 408 / 111 mm", "506 / 408 / 119 mm", "Same rain; ETc 1.8% lower"]
                  - ["Soybean", "490 / 371 / 124 mm", "499 / 365 / 138 mm", "Within 3%"]
                  - ["Spring wheat", "408 / 306 / 150 mm", "428 / 297 / 165 mm", "Within 5%"]
                  - ["Sunflower", "408 / 382 / 76 mm", "418 / 382 / 83 mm", "Within 3%"]
                  - ["Pest break (current / small grain / other family)", "100 / 75 / 100", "100 / 75 / 100", "Identical"]
                  - ["Strategy totals with the app's water shares", "82 / 68 / 60 (water 78 / 78 / 90)", "82 / 68 / 60 (water 76 / 74 / 88)", "Ranking and totals identical"]
            - p: "The worked example reruns cleanly: all 24 of its checks pass."
            - h3: "Robustness: does the answer change if one input changes?"
            - table:
                caption: "Robustness of the ranking"
                rows:
                  - ["Variant", "Current", "Small grain", "Other family", "Winner"]
                  - ["Baseline (3DEP slope 4.05%)", "82", "68", "60", "Current"]
                  - ["SSURGO mapped slope 8% (the steep-slope penalty applies)", "71", "60", "49", "Current"]
                  - ["No harvester", "82", "66", "60", "Current"]
                  - ["No goals (all weights 1)", "82", "69", "66", "Current"]
            - h3: "Water-limited yield (FAO-56 soil buffer, FAO-33 yield response)"
            - p: "The soil buffer is RAW = p × 1000 × AWC × Zr, with AWC 0.21 from SSURGO and p and Zr from FAO-56 Table 22. The rain deficit beyond the buffer is stress, and FAO-33 converts it to yield:"
            - formula: "1 − Ya / Ym = Ky × (1 − ETa / ETc)"
            - table:
                caption: "Water-limited yield, 2025"
                rows:
                  - ["Crop", "Deficit (mm)", "Soil buffer RAW (mm)", "Stress (mm)", "ETa/ETc", "Ky", "Yield factor"]
                  - ["Corn", "119", "116", "4", "0.993", "1.25", "0.991"]
                  - ["Soybean", "138", "63", "75", "0.85", "0.85", "0.872"]
                  - ["Spring wheat", "165", "116", "50", "0.884", "1.15", "0.867"]
                  - ["Sunflower", "83", "76", "7", "0.982", "0.95", "0.983"]
            - p: "The model gives soybean a 13% cut in 2025 because its shallow root zone (0.6 m, the low end of FAO-56 Table 22) holds half the buffer corn has. It did not happen: Story County soybeans yielded 4.2% above trend (NASS). With 1.3 m roots, or with gauge-based rain, the modelled cut falls to 0–2%. Over 2001–2025 the same model ranks drought insurance losses well but does not track yields (T5d, V2), so the buffer belongs in a drought flag, not a yield forecast. The app itself still ignores stored soil water (docs/FIELDS.md); this buffer exists only in the proposal script."
            - h3: "Pests the daily data can already flag"
            - ul:
                - "Tar spot (corn): 20 of the 150 corn-season days had a 30-day mean temperature of 18–23 °C, the most predictive range in the rule documented in pest_weather_rules.md. The first was 16 Jun and the longest run 16 days. Only 4 days reached a daily mean RH of 90% or more; the rule's humidity term is hourly, so that count is a proxy."
                - "Fall armyworm: 1,402–1,890 degree-days from May to October, enough for 3.6–3.9 generations after arrival. Two published thresholds were used (du Plessis 2020; Malekera 2022). The arrival date needs FAMEWS or trap data."
                - "Needs hourly data, which the Sonda or POWER hourly will supply: gray leaf spot, northern corn leaf blight and Asian soybean rust (current rotation). The small-grain rotation adds stripe, leaf and stem rust and Fusarium head blight."
                - "Backtest (T5d, V5): over 2001–2025 every rule leans the right way against insured disease and insect losses in Central Iowa (Spearman 0.14 to 0.32), but none is significant. The rules say when to scout; they need leaf-wetness hours and scouting or trap records before they can say more."
            - h3: "Nitrogen and margin per strategy (illustrative inputs)"
            - p: "These two results rest on 20 inputs tagged placeholder in the script: yields, prices, costs and N rates. Real values replace them through docs/proposal/ames_inputs.json once the NASS, AMS and ERS/ISU keys exist (U-20). They show the calculation the Costs and Markets module will run, not a forecast."
            - table:
                caption: "Nitrogen balance and margin per strategy"
                rows:
                  - ["Strategy", "N applied + fixed − removed, 3 seasons (kg N/ha)", "Margin, $/ha/yr", "Corn −20%", "Soybean +20%"]
                  - ["Current", "150 + 224 − 631 = −257 (partial balance) · −259 (soil mined)", "614", "478", "789"]
                  - ["Small grain", "240 + 112 − 484 = −132", "473", "336", "560"]
                  - ["Other family", "340 + 0 − 303 = +37", "409", "273", "409"]
            - p: "The margin ranking agrees with the agronomic ranking in all four price scenarios in the script. What the balance column adds is a cost the score does not show: in this partial balance (fertiliser plus fixation minus grain removal) the current rotation removes the most nitrogen. The backtest tested the margin idea on 2008–2025 with real NASS yields and prices (T5d, V7): choosing the crop each spring by expected margin earned $255/ha less over 18 years than the farmer's strict alternation, and $1,629/ha more than continuous corn. That is the trade-off a farmer should talk over with an adviser."
            - h3: "What the Sonda measures that the satellites cannot (from the same run)"
            - table:
                caption: "Wind sensitivity of the corn result"
                rows:
                  - ["Wind at 2 m (m/s)", "Corn ETc (mm)", "Deficit (mm)", "Corn yield factor"]
                  - ["1.0", "481", "98", "1.000"]
                  - ["2.0 (FAO-56 default used above)", "497", "112", "1.000"]
                  - ["3.0", "510", "124", "0.979"]
                  - ["4.0", "521", "134", "0.956"]
            - p: "Wind moves the corn yield factor by up to 4.4% between 2 and 4 m/s, but NASA POWER publishes daily wind at 2 m for every pin, and the worked example now uses it, so an anemometer is not what the Sonda adds. Leaf wetness is: every disease rule counts wetness hours, and the humidity proxy showed no significant link to real losses (T5d, V5). Rain is the other: NASA POWER read 12% below the 59 CoCoRaHS gauges near Ames in every season of 2008–2025 (T5d, V1). Each sensor in the design has a validation metric against its NASA counterpart:"
            - ul:
                - "Air temperature and humidity: bias and RMSE of daily Tmin/Tmax against POWER, and hours at RH 90% or more against POWER hourly."
                - "Soil moisture: correlation of daily anomalies against SMAP L4."
                - "Rain: bias of event totals and the hit rate for 25 mm days against IMERG."
                - "Radiation: bias of daily MJ/m² against POWER ALLSKY."
        t5d:
          title: "T5d · Backtest 2001–2025: would %{app_name} have been right on this field?"
          blocks:
            - p: "T5c shows that the formulas run and match the app. This section asks the harder question: on the same field (42.0, −93.75, Story County, Iowa), if %{app_name}'s calculations had been run every season from 2001 to 2025, would they have matched what really happened? Each study states its pass criterion before the results were seen, uses only data available before each decision, and scores %{app_name} against records it does not read: rain gauges, county yields, crop insurance losses by cause, field trials and satellite images. Nothing is fitted to the outcome; every coefficient comes from FAO, USDA or the cited papers. [VERIFIED: docs/proposal/validation/]"
            - evidence: "See the backtest evidence"
            - table:
                caption: "Eight studies, each with its criterion set before the results"
                rows:
                  - ["Study", "Question", "Truth (independent record)", "Criterion, set before the results", "Result", "Verdict"]
                  - ["V1 data", "Is the NASA data at the pin factual?", "59 CoCoRaHS gauges within 30 km; Daymet 1 km", "Tmax and Tmin RMSE ≤ 2.5 °C; May–Sep POWER rain within ±15% of gauges in ≥ 80% of years", "Tmax 1.7 °C, Tmin 2.4 °C, frost days agree 95%. POWER rain below the gauges in all 18 seasons (−12% on average), within 15% in 67%. IMERG within 15% in 83%", "FAIL (rain)"]
                  - ["V2 yield", "Would the water model have flagged the bad years?", "NASS Story County yields (detrended); RMA losses by cause", "r ≥ 0.5 with the yield anomaly and 2012 among the 3 lowest modelled years", "r = 0.03 (corn), −0.05 (soybean). Ranks drought + heat insurance losses well (ρ 0.61 and 0.80, p ≤ 0.001); 2012 lowest. Calls 22–24 of 25 seasons stressed", "FAIL"]
                  - ["V3 crop choice", "Does the crop evidence point at the crops that thrive?", "CDL 2008–2025; NASS yields", "Corn and soybean ranked above wheat and sunflower; GAEZ yield within ±30% of NASS", "GAEZ rates all 8 crops 10000 (cannot rank). Water criterion ranks wheat and sunflower first. GAEZ maize +20%, soybean +99% vs NASS", "FAIL"]
                  - ["V4 rotation", "Is the rotation advice backed by evidence?", "Zhao et al. 2022: 670 trials, maize after soybean, Ames-like climate, farm N rates", "95% interval of the soybean pre-crop effect excludes zero", "+9.9% maize yield [7.2 to 13.2%]; +46% without N fertiliser. The farmer's strict alternation meets every comparator rule", "PASS"]
                  - ["V5 pests", "Do the pest weather rules match real losses?", "RMA disease, mycotoxin and insect losses, Central Iowa district", "Reported, not scored", "All five rules lean the right way (ρ 0.14–0.32), none significant; first favourable day about 3 months before the main loss month", "REPORTED"]
                  - ["V6 erosion", "How much soil does each rotation lose, and how much does a cover save?", "RUSLE (AH-703) on Daymet rain, SSURGO K and slope length", "The app's erosion score orders the strategies as RUSLE does", "Order holds (small grain < current < other family). Rye cover saves 13–14%. Absolute losses (17–24 t/ha/yr) rest on assumed residue and cover values", "PASS"]
                  - ["V7 money and operations", "Would choosing by expected margin have paid? Can the farm plant on time?", "NASS yields, prices, days suitable for fieldwork, planting progress", "Margin rule's realised margin ≥ the farmer's, 2008–2025", "Margin rule $11,995/ha vs farmer $12,250 vs continuous corn $10,366 vs hindsight $13,567. One 12-row planter covers 400 ha in all 25 springs. Iowa corn is 50% planted 25 Apr–19 May, not 1 Apr", "FAIL"]
                  - ["V8 timeline", "Do the timeline's crop and bare months match the field?", "Landsat + Sentinel-2 monthly NDVI 2013–2025 with the CDL crop", "≥ 80% monthly agreement and both season edges within one month in ≥ 80% of years", "76% agree; edges within a month in 8% of seasons. A green canopy appears 2.2 months after the FAO-56 planting month; Nov–Dec open soil in 26 of 26 views", "FAIL"]
            - h3: "Answers to the questions this proposal must answer"
            - ul:
                - "Could %{app_name} have predicted the facts on this field? Partly. Temperature and frost from NASA POWER are reliable at the pin (V1). Rain is not: POWER reads about 12% low against local gauges every season, while IMERG passes the same test. The water model is a good drought-disaster flag (it ranks 2012 and the insured drought years correctly) but not a yield forecast (V2)."
                - "Can it suggest a better rotation or a replacement crop? A better rotation, yes, and the evidence is strong: 670 field trials give +9.9% corn yield after soybean at farm nitrogen rates (V4), and RUSLE confirms the erosion ranking (V6). A replacement crop, not yet: GAEZ suitability cannot rank crops here, and the water criterion alone would point at wheat and sunflower (V3). Ranking crops needs the margin criterion of Gate 3 with real yields and prices, and even then a simple margin-switching rule did not beat the farmer's alternation (V7)."
                - "Can it help prevent pests and disease? It can say when weather favours a disease, as a reminder to scout; it cannot yet say a crop will be hit. No weather rule tracked real losses significantly (V5). Leaf-wetness hours and scouting or trap records are needed, which is the strongest case for the Sonda (T5b)."
                - "Can it inform costs, supplies, people, equipment and land productivity? The calculations work on real data: field-capacity checks against NASS days suitable for fieldwork (one 12-row planter covers 400 ha in every spring since 2001), planting windows from NASS progress, nitrogen balances and margins per strategy. What is proven is the value of rotating against continuous corn ($1,629/ha over 18 years, V7); what is not proven is that %{app_name} beats an experienced farmer's practice. Costs remain placeholders until ISU or ERS budgets are loaded (U-26)."
            - h3: "What changes because of this"
            - ul:
                - "Read rain for the water need from IMERG (already fetched for storms) instead of POWER (U-27)."
                - "Take planting months from NASS progress or GEOGLAM crop calendars, not the FAO-56 table (U-28)."
                - "Drive the timeline's crop and bare months from the observed NDVI the app already fetches, and count May–June under young crops as exposed (U-29)."
                - "Show the water model as a drought-risk flag, never as a yield number, until it is calibrated (U-30)."
                - "Report erosion as RUSLE soil loss with documented residue and cover inputs and a published Iowa reference (U-31)."
                - "Validate the disease rules with leaf-wetness hours and scouting records in the pilot (U-32)."
            - lead: { b: "Limits of this backtest.", t: "One field and one county; yields and insurance losses are county aggregates; insured losses are a thin proxy for disease; costs are placeholders; the RUSLE losses rest on assumed residue and cover values. Reproduce with mise exec -- bin/rails runner docs/proposal/validation/fetch.rb, then mise exec -- ruby docs/proposal/validation/run_all.rb and mise exec -- ruby docs/proposal/claims_audit.rb." }
        t6:
          title: "T6 · Evidence and validation"
          blocks:
            - p: "The software rests on working code and documented sources. The value to farmers has not been tested with any farmer yet [VERIFIED: team overview §5, \"We have not measured outcomes with farmers yet\"]. So Gate 1 is about evidence, not features."
            - h3: "What is evidenced today"
            - ul:
                - "A live system at aluni.us, deployed automatically from main, with a two-farm demo script [VERIFIED: ROADMAP.md, DEMO.md]."
                - "13 data sources fetched per field pin, each value labelled with its dataset [VERIFIED: FIELDS.md]."
                - "About 60 data-source files with captured requests and licence verdicts [VERIFIED: docs/data_sources/, DATA_SOURCES.md]."
                - "Automated checks: RSpec, RuboCop, Brakeman, Rust checks [VERIFIED: README.md]. The decision engine is reproduced on a real field (Ames, 2025) by a script with 24 passing checks, and its results match the production services under bin/rails runner (T5c)."
                - "A 25-year backtest on the Ames field (T5d) scores eight claims against independent records: 2 pass, 1 is reported, 5 fail with a stated cause and fix. docs/proposal/claims_audit.rb recomputes 40 figures in this document."
                - "Known method limits, already stated by the team: NASA POWER is about 50 km and GAEZ about 9 km; water need ignores stored soil water [VERIFIED: FIELDS.md, team overview §11]."
            - h3: "TRL register (NASA scale; self-assessed, not independently reviewed)"
            - table:
                caption: "TRL register"
                rows:
                  - ["Component", "TRL now", "Evidence", "Target TRL", "De-risking step", "Gate"]
                  - ["Rotation comparator, timeline, evidence", "5–6", "Live with real NASA data at two demo pins; reproduced and cross-checked on a third real field (T5c); backtested 2001–2025 on that field (T5d: 2 pass, 5 fail); no real users yet", "7", "Season-long pilot with 10+ farmers", "G1"]
                  - ["Gemini \"why\" with guardrails", "6", "In production, capped, falls back to rule text", "7", "Pilot review of narration accuracy", "G1"]
                  - ["iOS and Android shells", "4–5", "Built, not in the stores [VERIFIED: team overview §10]", "7", "Store release, TalkBack/VoiceOver tests", "G1"]
                  - ["Season Execution Plan; People, Equipment, Supplies", "1–2", "Concept in this document", "6", "Clickable prototype, then a pilot build", "G2"]
                  - ["Costs, Budget, Markets", "1–2", "Sources documented; nothing built", "6", "One-country price feed + cost per ha", "G3"]
                  - ["Sonda Lite / Pro", "2", "Design doc and a 3D catalogue page", "6", "EVT then DVT field season", "HW gates"]
            - h3: "Known/unknown register"
            - p: "Nothing in this document may rest on these items until they are resolved. Owners are [UNKNOWN] until the team assigns them (U-04)."
            - table:
                caption: "Known/unknown register"
                rows:
                  - ["ID", "Open item", "Depends on it", "Resolution action", "Due"]
                  - ["U-01", "Overview says MODIS, ECOSTRESS and GRACE are \"next\"; ROADMAP.md marks them done", "E4, T5, submission text", "Check production; fix the overview", "Before submission"]
                  - ["U-02", "Overview: \"15 sources, 6 from NASA\"; repo: 9 NASA datasets; FIELDS.md still says AppEEARS and FAO-56 not connected", "E4, T5", "Count from the registry; update FIELDS.md", "Before submission"]
                  - ["U-03", "No LICENSE file in the repo root", "T15, T8", "Choose and add a licence", "Before submission"]
                  - ["U-04", "Team names, roles, hours", "T10, T16", "Fill overview §14", "Before submission"]
                  - ["U-05", "Farmers' use of and willingness to pay for the integrated tool", "T7, T8, T12", "Gate 1 pilot", "G1"]
                  - ["U-06", "What BAU costs farmers (time, adviser fees, losses)", "T1, T12", "Pilot interviews", "G1"]
                  - ["U-09", "Does the BG95-M3 grant cover the Pro host? PTCRB/carrier needed?", "T5b, T15", "Ask a test lab and Quectel", "HW DVT"]
                  - ["U-10", "Chile (SUBTEL) and EU radio rules", "T15", "Ask a test lab", "HW DVT"]
                  - ["U-11", "Real data per device per month (A-1 uses 5 MB)", "T11", "Measure on EVT", "HW EVT"]
                  - ["U-13", "Gemini input tokens per narration (output is capped and priced)", "T11", "Log token counts for one week", "G1"]
                  - ["U-15", "Pilot travel and farmer incentives", "T11", "Site plans for York and Buin", "G1"]
                  - ["U-16", "Machine-data import standard for the Equipment module", "T5", "Survey pilot farms' machines", "G2"]
                  - ["U-17", "farmOS integration effort (Option A)", "T4", "2-day spike", "G1"]
                  - ["U-18", "Commercial platform API terms (Option D)", "T4", "Read 2 platforms' terms", "G2"]
                  - ["U-19", "Farm-data privacy duties in the US and Chile", "T15", "Legal review", "G2"]
                  - ["U-20", "NASS, AMS, api.data.gov keys not configured; no FAOSTAT token route [VERIFIED: DATA_SOURCES.md]", "Module 9", "Apply for keys; bulk files meanwhile", "G3"]
                  - ["U-21", "Radiation sensor part for the Pro", "T5b", "Pick a part", "HW EVT"]
                  - ["U-22", "Small Sonda parts and PCB solder-joint count", "T5b, T11", "First layout and full quote", "HW DVT"]
                  - ["U-23", "Gate dates and decision owner", "E12, T9, T16", "Team sets them", "Before submission"]
                  - ["U-24", "Exposed-month baseline on each pilot field (the Ames example in T5c is the method)", "T2, T17", "Run the timeline at enrolment", "G1"]
            - h3: "Added in draft 0.2 (raised by the worked example)"
            - table:
                caption: "Register items added in draft 0.2"
                rows:
                  - ["ID", "Open item", "Depends on it", "Resolution action", "Due"]
                  - ["U-25", "Leaf-wetness part for the Pro (every disease rule counts wetness hours). Wind comes from NASA POWER WS2M, so an anemometer is optional", "T5b, T5c", "Pick parts for the SDI-12 port and price them", "HW EVT"]
                  - ["U-26", "20 placeholder inputs behind the nitrogen and margin results (yields, prices, costs, N rates), plus the Ames farmer's own profile answers", "T5c, T12", "Fill docs/proposal/ames_inputs.json from NASS, AMS and ISU/ERS (needs the U-20 keys)", "G1"]
                  - ["U-27", "The water need reads POWER rain, which is 12% below local gauges; IMERG passes (V1)", "T5c, module 2", "Switch Crops::WaterNeed to IMERG rain; rerun T5c", "G1"]
                  - ["U-28", "Planting months come from the FAO-56 table (corn 1 April); Iowa plants late April to mid May (V7, V8)", "T5c, module 2", "Use NASS progress or GEOGLAM calendars per region", "G1"]
                  - ["U-29", "The timeline counts the field as covered from planting; NDVI shows open soil until July and in Nov-Dec (V8)", "O2, T5c", "Drive crop months from observed NDVI", "G1"]
                  - ["U-30", "The water model does not track yields (r near 0, V2)", "E8, T5c", "Present as drought risk only; calibrate before any yield figure", "G1"]
                  - ["U-31", "RUSLE residue and cover inputs are assumptions; no published Iowa soil-loss reference documented (V6)", "O2, T5d", "Document NRCS residue values and an Iowa reference", "G1"]
                  - ["U-32", "Pest rules show no significant link to insured losses (V5)", "Module 3, T5b", "Pilot: leaf wetness plus scouting records", "HW EVT"]
            - lead: { b: "Resolved since draft 0.1:", t: "soil probe chosen for EVT (U-07, Seeed S-Soil MT-02B); power, enclosure and charger priced (U-08); hosting after credits $24.46/month (U-12); labour rates from BLS (U-14)." }
            - note: "register"
            - lead: { b: "Assumptions log:", t: "A-1 (5 MB a month per Pro device, illustration only; switching value about 33 MB, T5b). No other planning assumption is used." }
            - note: "register"
        t7:
          title: "T7 · Market, users and competitors"
          blocks:
            - p: "The gap %{app_name} can claim is NASA evidence per field, with its source shown, joined to season execution, free and in two languages. No competitor reviewed does all of that. Whether farmers value it is not yet proven (U-05)."
            - h3: "Segments (already coded in %{app_name}'s segment classifier [VERIFIED: docs/ONBOARDING.md])"
            - table:
                caption: "Segments"
                rows:
                  - ["Segment", "Rule in the app", "Likely need from the vision modules [DESIGN]", "Demand evidence"]
                  - ["Smallholder subsistence", "Under 2 ha, solo or family, low budget, own use or local market", "Plan, alerts, Spanish, phone first; little equipment or inventory", "[UNKNOWN]"]
                  - ["Small commercial", "Under 20 ha, sells beyond own use", "Tasks, supplies, cost per strategy", "[UNKNOWN]"]
                  - ["Mid mechanized", "20–200 ha, or a tractor plus planter/harvester with a small team or crew", "Equipment registry, People and Tasks, budgets, Sonda Pro", "[UNKNOWN]"]
                  - ["Large commercial", "Over 200 ha, or a crew selling wholesale, contract or export", "Probably already has a platform; %{app_name} as an evidence layer", "[UNKNOWN]"]
            - lead: { b: "Size reference:", t: "more than 475 million farms under 2 ha, and only 1% of farms over 50 ha, which hold about two-thirds of the land [VERIFIED: FAO, Lowder et al., via People Food and Nature]. Serviceable and obtainable shares: [UNKNOWN]. The format asks for bottom-up demand, so this waits for the pilot." }
            - h3: "Competitors and substitutes"
            - table:
                caption: "Competitors and substitutes"
                rows:
                  - ["Product", "What it covers", "Price", "Difference from %{app_name}", "Source"]
                  - ["Climate FieldView (Bayer)", "Field data, yield analysis, imagery, prescriptions; row crops", "Basic free; Plus from $649/yr; FieldView Drive 2.0 $499", "Paid analytics; not rotation-first; English-first", "[VERIFIED (secondary): softwares.com, yespress.io]; tiers $249/$649/$1,399 on a climate.com pricing page [VERIFIED]"]
                  - ["Farmbrite", "All-in-one records: crops, livestock, accounting, tasks", "Crop plans from $29/mo; Essentials $59/mo, up to 10 team members", "Strong on operations; no NASA rotation evidence found", "[VERIFIED (secondary): Capterra, FitGap]"]
                  - ["farmOS", "Open-source records: assets incl. equipment, maintenance logs, inventory, sensors", "Free (GPL); hosted from $50/yr", "Records, not decision support; possible partner (Option A)", "[VERIFIED: farmos.org]; hosting price [VERIFIED (secondary): SourceForge]"]
                  - ["Extension offices, agronomists", "Local advice", "[UNKNOWN]", "%{app_name} sends farmers in with concrete questions, not instead", "Team overview §5"]
            - lead: { b: "Unfair advantage.", t: "Following the Lean Canvas advice, this stays blank until the pilot shows one. Candidates to test: per-field NASA evidence with provenance, open source, and Spanish parity." }
            - lead: { b: "Stakeholders [DESIGN]:", t: "farmers (users, decide); farm workers and managers (users of Tasks); extension services and cooperatives (channel, possible payers); NASA and data providers (sources; attribution); hardware suppliers and test labs; Space Apps judges (immediate)." }
        t8:
          title: "T8 · Operating model"
          blocks:
            - p: "Today %{app_name} runs at about $0 on cloud credits, with operator switches that pause AI, jobs, mail and push [VERIFIED: CLAUDE.md, DEPLOY.md]. After the credits, the same VM costs $24.46 a month, and Gemini is capped at $153.60 a month (T11). Who pays later is open."
            - ul:
                - "Service: one GCE VM running web, worker, Postgres and Redis through Kamal; deploys about 3 minutes from a push to main [VERIFIED: team overview §13]."
                - "Scaling: add Puma and Sidekiq containers; observations are cached per field, so traffic does not multiply outside API calls [VERIFIED: team overview §12]."
                - "Support and operations staff: [UNKNOWN] (U-04)."
            - h3: "Revenue options [DESIGN], none validated (U-05)"
            - table:
                caption: "Revenue options"
                rows:
                  - ["Option", "Who pays", "Fits segment", "Risk"]
                  - ["Free core, open source", "Grants and credits", "All", "Grant dependence"]
                  - ["Sonda hardware plus a connectivity plan", "Farmer", "Mid mechanized, small commercial", "Hardware margin and support"]
                  - ["Institutional licence: adviser dashboards, cohort reports", "Extension services, cooperatives, NGOs", "Smallholders through intermediaries", "Long sales cycles"]
                  - ["Premium operations modules (budgets, multi-user)", "Farmer", "Small commercial, mid mechanized", "Competes with Farmbrite pricing"]
            - p: "Unit economics (customer acquisition cost, payback, churn): [UNKNOWN]. They come from the pilot, not from this document."
        t9:
          title: "T9 · Implementation plan and gates"
          blocks:
            - p: "Four gated phases run in sequence, with a parallel hardware track. Each phase starts only when the previous gate passes. All dates are [DESIGN] targets with no reference-class check yet. Per the format, treat them as optimistic and add buffer once the team's capacity is known (U-04, U-23)."
            - h3: "Roadmap · 4 software phases, 3 hardware phases, 5 gates"
            - figure: "The software phases run in sequence behind G1–G3. The hardware track starts after submission and has its own two gates."
            - table:
                caption: "Work packages"
                rows:
                  - ["WP", "Phase", "Deliverables", "Depends on"]
                  - ["WP0", "Hackathon close (Nov 2026)", "Fix U-01–U-04 and U-23; submit this proposal with the live demo", "–"]
                  - ["WP1", "Validate (target Dec 2026–Feb 2027)", "Shells in the stores; 10+ pilot farmers in York and Buin; usability sessions before and after the UX plan (team overview §17); baselines U-05, U-06, U-24; farmOS spike (U-17)", "WP0"]
                  - ["WP2", "Operations core (target Mar–Jun 2027)", "Season Execution Plan; People and Tasks (multi-user farms); Equipment registry and maintenance; Supplies and stock; observed vs planned bare months", "G1 pass"]
                  - ["WP3", "Economics (target Jul–Sep 2027)", "Cost items per operation; price feeds for 2 countries; gross margin criterion; monthly cash view", "G2 pass"]
                  - ["HW1", "EVT (target Q1 2027)", "10 units from dev boards; payload defined (U-11); Seeed and DFRobot probes compared; leaf-wetness part added (U-25); small parts quoted (U-22)", "WP0"]
                  - ["HW2", "DVT (target Q2–Q3 2027)", "Custom PCB, 20–30 units, one field season, calibration per soil texture; ingestion API in Rails", "HW gate 1"]
                  - ["HW3", "Certify + PVT (target Q4 2027 or later)", "Lite certification first; 100-unit pilot batch", "HW gate 2"]
            - h3: "Gate criteria [DESIGN; thresholds for the team to confirm]"
            - table:
                caption: "Gate criteria"
                rows:
                  - ["Gate", "Pass when", "Owner"]
                  - ["G1 Validate", "O1 met (under 5 min, 4 of 5 unaided); at least 6 of 10 pilot farmers say they would use a season plan with tasks; U-05/U-06/U-24 baselines recorded", "[UNKNOWN]"]
                  - ["G2 Operations", "At least 3 of 10 pilot farmers log operations weekly for 6 weeks (O3); one institutional partner shows interest in writing", "[UNKNOWN]"]
                  - ["G3 Economics", "Cost per ha shown for every strategy in 2 countries (O4); price-feed licences confirmed", "[UNKNOWN]"]
                  - ["HW gate 1", "EVT readings paired with SMAP and IMERG for 60 days on 2 pilot fields; BOM inside the price ceiling", "[UNKNOWN]"]
                  - ["HW gate 2", "DVT survives one season (IP67, battery); the certification path is confirmed and costed (U-09, U-10)", "[UNKNOWN]"]
            - lead: { b: "Change control:", t: "the scope list in T3 is the baseline. Any new module needs a gate decision, because scope creep is the top risk (T14)." }
        t10:
          title: "T10 · Resources and team"
          blocks:
            - p: "The team has shipped a working full-stack product in the hackathon window: 102 commits, Rails, Rust, two native shells and nine NASA datasets [VERIFIED: git log, ROADMAP.md]. Names, roles and time commitment are not in the overview (U-04)."
            - table:
                caption: "Roles needed"
                rows:
                  - ["Role needed", "Phase", "Filled by", "Commitment", "Gap / mitigation [DESIGN]"]
                  - ["Product lead / sponsor", "All", "[UNKNOWN]", "[UNKNOWN]", "Name one accountable owner"]
                  - ["Rails + Hotwire engineer(s)", "WP1–WP3", "AstroMichis team [UNKNOWN who]", "[UNKNOWN]", "–"]
                  - ["Agronomist / extension partner", "WP1–WP3", "None", "–", "Recruit via an extension office at each pilot site"]
                  - ["Embedded firmware engineer (ESP-IDF, cellular)", "HW1–HW3", "None known", "–", "Critical gap for the hardware track"]
                  - ["Hardware / mechanical (PCB, enclosure, IP67)", "HW2–HW3", "None known", "–", "Contract design house or university lab"]
                  - ["Field pilot coordinator (US, Chile)", "WP1", "[UNKNOWN]", "–", "One per site"]
                  - ["Compliance and legal (radio, privacy, licences)", "HW3, G2", "None", "–", "Test lab advice; pro-bono legal clinic"]
        t11:
          title: "T11 · Cost model"
          blocks:
            - p: "Gate 1 costs $25,538 (base, AACE Class 5: −50% / +100%, so $12,769–$51,075). The table below is the whole calculation: a quantity times a sourced rate on every line. Quantities are [DESIGN] and the team can change them; the rates are not."
            - lead: { b: "Estimate class:", t: "AACE Class 5 (0–2% definition; −20/−50% to +30/+100%). Optimism bias: apply the HM Treasury upper bound, as the format guide says: 200% for equipment/development (the hardware track and new modules) and 41% for outsourcing (opex), when each base is known." }
            - table:
                caption: "Gate 1 budget (12 weeks)"
                rows:
                  - ["Gate 1 line (12 weeks)", "Quantity [DESIGN]", "Rate", "Rate source", "USD"]
                  - ["Software development (WP1: shells, pilot fixes, UX plan)", "240 h (0.5 FTE × 12 wk × 40 h)", "$63.20/h", "BLS 2024 median pay, software developers [VERIFIED: BLS OOH]", "15,168.00"]
                  - ["Agronomist / pilot lead (York, Buin)", "120 h (0.25 FTE)", "$37.87/h", "BLS 2024 median pay, agricultural and food scientists [VERIFIED: BLS OOH]", "4,544.40"]
                  - ["Sonda Pro EVT units", "10", "$522.65 each: Pro BOM $493.73 with the BG95 module ($26.07) swapped for a BG95-M3 Zero dev board ($54.99)", "T5b; [VERIFIED: Waveshare]", "5,226.50"]
                  - ["Hosting, e2-medium VM, us-central1", "3 months", "$24.46/month (disk and egress extra)", "[VERIFIED (secondary): Economize, VPSBenchmarks]", "73.38"]
                  - ["Gemini 2.5 Flash narration, cost ceiling", "90 days × 2,000 requests/day cap × 1,024 max output tokens", "$2.50 per 1M output tokens", "Cap and token limit [VERIFIED: ROADMAP.md, ONBOARDING.md]; price [VERIFIED (secondary): Requesty, Maxim]", "460.80"]
                  - ["Connectivity, 10 Pro units", "10 SIMs + 3 months", "$3/SIM, $1/month, $0.03/MB (A-1: 5 MB/month)", "[VERIFIED: hologram.io]", "64.50"]
                  - ["Total, Gate 1", "", "", "", "25,537.58"]
            - note: "bom"
            - p: "The Gemini line is a ceiling: it assumes every daily request hits the cap at full output length. Input tokens are extra at $0.30 per 1M. Not included: pilot travel and farmer incentives (U-15), and the small Sonda parts listed in T5b."
            - lead: { b: "Whole-life running cost after Gate 1 (per month):", t: "VM $24.46 + Gemini at most $153.60 (30 days at the output ceiling) + $1.15 per Pro device in the field." }
        t12:
          title: "T12 · Financial and social viability"
          blocks:
            - p: "Costs are now sourced (T11); revenue is not, because willingness to pay comes from the pilot (U-05). This section fixes the tests the numbers must pass at Gate 2. Per-field economics are already shown on illustrative inputs in T5c: $614, $473 and $409 per ha a year for the three Ames strategies."
            - ul:
                - "Social value (non-monetized, to be measured): fewer exposed bare months (O2); water and nitrogen use per strategy; earlier frost, heat and rain warnings; NASA evidence reaching Spanish-speaking smallholders [VERIFIED as team-stated aims: team overview §5]."
                - "Hardware unit test [DESIGN]: price per Sonda must be at least full BOM + assembly + certification amortised over the batch + 12 months of connectivity. That sum is the switching value. With today's figures it is at least $507.53 per Pro ($493.73 BOM + 12 × $1.15 connectivity), before certification (U-09) and small parts (U-22)."
            - note: "bom"
            - ul:
                - "Software test [DESIGN]: yearly hosting + AI + support per active farm must be covered by grants or the institutional licence (T8). The fixed platform cost is $24.46 a month for the VM, plus at most $153.60 a month for Gemini at its cap, shared across every farm on the platform."
                - "Scenarios (downside / base / upside): to be built at Gate 2 from pilot data. No figures here, to avoid an upside-only model."
        t13:
          title: "T13 · Funding structure"
          blocks:
            - p: "The only resources confirmed today are in-kind: Google Cloud credits and Gemini on Vertex, Cloudflare, Meteomatics' hackathon offer and free public data [VERIFIED: team overview §14, DEPLOY.md]. Everything else is a candidate."
            - table:
                caption: "Funding sources"
                rows:
                  - ["Source", "Amount", "Status", "Linked gate"]
                  - ["Google Cloud credits", "[UNKNOWN] remaining", "Committed (in use)", "WP0–WP1"]
                  - ["Meteomatics hackathon offer", "[UNKNOWN] term", "Committed (in use)", "WP0–WP1"]
                  - ["Space Apps recognition or follow-on programmes", "[UNKNOWN]", "Indicative", "G1"]
                  - ["Agricultural research or innovation grants (US, Chile)", "[UNKNOWN]", "Not researched", "G1–G2"]
                  - ["Extension services or cooperatives (licence or pilot partner)", "[UNKNOWN]", "Not contacted", "G2"]
                  - ["Hardware pre-orders from pilot farms", "[UNKNOWN]", "Not offered", "HW gate 2"]
        t14:
          title: "T14 · Risks, assumptions, dependencies"
          blocks:
            - p: "The biggest risk is not technical. The vision could grow into a generic farm-management tool and lose what makes %{app_name} different, while a small team spreads itself across software and hardware. Probability and impact are [DESIGN] team estimates (H/M/L), not measured."
            - table:
                caption: "Risk register"
                rows:
                  - ["ID", "Risk (cause → event → effect)", "P", "I", "Response", "Early warning", "Source"]
                  - ["R1", "Many modules → scope creep → no module reaches TRL 7", "H", "H", "Gates; operations modules only after G1; accounting out of scope", "WP2 slips more than one month", "[DESIGN]"]
                  - ["R2", "Farmers don't log operations → the plan stays advice", "M", "H", "Pre-filled tasks from the plan; one tap to confirm; kill criterion K1", "Under 3 of 10 weekly loggers", "[DESIGN]"]
                  - ["R3", "Coarse data (POWER about 50 km, GAEZ about 9 km) misleads a small field", "M", "M", "Each value shows dataset and resolution; comparison is relative; Sonda adds ground truth", "Pilot farmer disputes", "[VERIFIED: team overview §11]"]
                  - ["R4", "Hardware BOM and certification cost exceed what farmers pay", "M", "H", "Lite first; host SDoC path; price ceiling at HW gate 1", "Small-parts quote (U-22)", "[DESIGN]"]
                  - ["R5", "No firmware or hardware skills on the team", "H", "H", "Recruit or partner before HW2", "No named owner by EVT", "T10"]
                  - ["R6", "AppEEARS runs one task at a time per account → new fields wait hours for SMAP, MODIS, ECOSTRESS", "H", "L", "Queue and show waiting states; more accounts [UNKNOWN if allowed]", "Pilot onboarding delays", "[VERIFIED: DEMO.md]"]
                  - ["R7", "Outside services fail or rate-limit", "M", "M", "Retries with backoff; background jobs; pause switches", "Error rates", "[VERIFIED: ROADMAP.md, team overview §11]"]
                  - ["R8", "AI narration states something wrong", "L", "M", "Gemini only narrates computed facts; rule text when off", "Pilot review", "[VERIFIED: FIELDS.md]"]
                  - ["R9", "Credits end → hosting and AI costs appear", "M", "M", "Priced: VM $24.46/month, Gemini at most $153.60/month (T11); budget alert and pause switches", "GCP billing alert", "[VERIFIED: DEPLOY.md]"]
                  - ["R10", "A data licence bars a commercial tier", "L", "M", "Licence verdicts already recorded; excluded sources listed", "New source added", "[VERIFIED: DATA_SOURCES.md]"]
            - lead: { b: "Dependencies:", t: "NASA POWER, AppEEARS and Earthdata; Planetary Computer; FAO GAEZ; USDA and USGS services; Meteomatics; Vertex AI; GCP; Cloudflare; app stores for the shells; a cellular carrier and test lab for the Pro [VERIFIED: FIELDS.md, CLAUDE.md, DEVICES.md]." }
        t15:
          title: "T15 · Legal, regulatory and compliance"
          blocks:
            - p: "Two items block a public launch: %{app_name} has no visible licence, and the hardware has no certification path. Neither is hard to fix, but neither is fixed yet."
            - table:
                caption: "Compliance requirements"
                rows:
                  - ["Requirement", "Authority", "Status", "Lead time", "Risk if missed"]
                  - ["Open-source licence for the repo", "Team", "No LICENSE file in the repo root (U-03)", "Hours", "\"Open source\" claim not legally true"]
                  - ["Data licences and attribution", "Each provider", "Verdicts recorded per source; non-commercial sources excluded [VERIFIED: DATA_SOURCES.md]", "Ongoing", "Takedown or redistribution breach"]
                  - ["Radio certification, US", "FCC Part 15", "Not started", "3–16 weeks; up to 6–9 months with PTCRB [VERIFIED (secondary): MarkReady]", "Cannot sell the Sonda"]
                  - ["Radio certification, Chile and EU", "SUBTEL; CE/RED", "[UNKNOWN] (U-10)", "[UNKNOWN]", "Cannot pilot the Pro in Buin"]
                  - ["Farm and personal data privacy", "US, Chile law", "Passkeys, Active Record encryption, export to CSV/JSON in place [VERIFIED: CLAUDE.md, team overview §11]; legal duties [UNKNOWN] (U-19)", "[UNKNOWN]", "Trust and compliance"]
                  - ["App store publishing", "Apple, Google", "Shells built, not submitted [VERIFIED: team overview §10]", "Review times [UNKNOWN]", "No push alerts on phones"]
        t16:
          title: "T16 · Governance and decision rights"
          blocks:
            - p: "One person must own each gate. Today no owner is named (U-04, U-23). Proposed RACI [DESIGN]:"
            - table:
                caption: "RACI"
                rows:
                  - ["Decision", "Product lead", "Engineering", "Hardware lead", "Agronomy partner", "Team (all)"]
                  - ["Pass or kill a gate", "A", "C", "C", "C", "I"]
                  - ["Add a module to scope", "A", "R", "C", "C", "I"]
                  - ["Hardware price ceiling and BOM", "C", "I", "A/R", "I", "I"]
                  - ["Pilot design and farmer consent", "A", "C", "I", "R", "I"]
                  - ["Data source and licence approval", "A", "R", "I", "C", "I"]
        t17:
          title: "T17 · KPIs and benefits"
          blocks:
            - p: "The team's own UX targets are the first KPIs; the farm-outcome KPIs follow once baselines exist."
