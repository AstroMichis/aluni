                  - ["K4", "HW gate 2", "Pro certification only by the PTCRB/carrier path with no funder for it → ship Lite only", "Test-lab quote"]
                  - ["K5", "G2", "No institutional partner or grant shows interest in writing → stay a free open-source tool, stop the paid tiers", "Partner pipeline"]
