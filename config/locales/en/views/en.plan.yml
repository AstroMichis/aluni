# The action plan page (/plan): the integrated project proposal, draft 0.3, transcribed for
# the Space Apps judges. Each section is a list of blocks rendered by plan/_blocks:
#   p (paragraph), lead (b + t: a paragraph with a bold lead-in), h3, ul, ol, checklist,
#   table (caption + rows; the first row is the header), formula, figure (a caption),
#   note (bom or register: the shared "under revision" notes below), evidence (a link to /evidence).
# Arrays collapse in spec/i18n/locale_parity_spec.rb, so es.plan.yml must keep the same blocks by hand.
en:
  plan:
    show:
      title: "%{app_name}: Integrated Project Proposal"
      description: "The %{app_name} action plan for NASA Space Apps 2026: the integrated project proposal, with every figure and evidence label."
      nav_label: "Site"
      back_home: "Back to home"
      eyebrow: "Action plan · NASA Space Apps 2026"
      headline: "%{app_name}: Integrated Project Proposal (Draft for team review)"
      version: "Draft 0.3 · 15 Nov 2026"
      lede: "%{app_name} today is a live rotation-comparison tool. This proposal is about where it ends up: one place where a farmer plans and runs the whole season."
      legend_title: "Evidence labels used in every section"
      legend:
        - ["Label", "Meaning", "What may rest on it"]
        - ["[VERIFIED: source]", "Read this session in the repo, the team's overview, or an opened web source", "Decisions and numbers"]
        - ["[VERIFIED (secondary): source]", "Read only on a reseller, directory or summary page", "Context; upgrade before a funding decision"]
        - ["[UNKNOWN]", "Not verified. Listed in the register (T6) with an owner and an action", "Nothing. No cost, date or go-decision depends on it"]
        - ["[ASSUMPTION A-n]", "A deliberate planning value, logged with its switching value", "Illustration only, never the ask"]
        - ["[DESIGN]", "A proposal by the authors (the vision), not a fact", "Discussion; needs team approval"]
      toc_label: "Contents"
      table_hint: "Swipe sideways to see the whole table."
      back_to_top: "Back to contents"
      evidence_cta: "See the evidence page"
      notes:
        bom: "Under revision: the updated Sonda section (T5b) no longer states a full unit BOM."
        register: "Under revision: the updated Sonda section (T5b) lists U-07 and U-08 as open again and uses assumptions A-2 and A-3."
      sections:
        read:
          title: "How to read this draft"
          blocks:
            - p: "%{app_name} today is a live rotation-comparison tool. This proposal is about where it ends up: one place where a farmer plans and runs the whole season, covering land, crops, people, machines, supplies, money, sensors and every data feed. Each part below is marked built, designed or vision, so the team can tell the prototype from the end goal."
            - lead: { b: "Stage.", t: "Strategic Outline Case (SOC). Cost estimate AACE Class 5 (concept screening, expected range −20% to −50% / +30% to +100%). The format follows the uploaded Integrated Project Proposal Format (Green Book five cases, TRL, AACE, known/unknown register)." }
            - lead: { b: "What was read for this draft:", t: "the repo (README.md, CLAUDE.md, docs/ROADMAP.md, docs/DEVICES.md, docs/FIELDS.md, docs/DATA_MODEL.md, docs/DATA_SOURCES.md, docs/DEMO.md, parts of docs/ONBOARDING.md, app/models/farmer_profile.rb, the weather, crops and rotations services, config/crops/agronomy.yml, config/demo_farms.yml and docs/proposal/ (worked example and cross-check); git log shows 102 commits, last on 15 Nov 2026); the team's %{app_name}: Project Overview (15 Nov 2026); the format guide; and the web pages under Sources. Where the repo and the overview disagree, both are kept and the conflict goes to the register." }
            - lead: { b: "Not read:", t: "firmware (none exists), the iOS and Android code, docs/AUTH.md, docs/INTEGRATIONS.md in full, docs/deploy/DEPLOY.md in full, and any team member's CV." }
        executive:
          title: "Executive layer (decision brief)"
          blocks:
            - lead: { b: "E0 · Header.", t: "%{app_name}, by the AstroMichis team. NASA Space Apps 2026, challenge \"Adapting Farms with NASA Data\". Stage: SOC. Estimate: AACE Class 5. TRL: web decision tool 5–6 (self-assessed), farm-operations modules 1–2, Sonda field station 2 (see T6). Version: draft 0.3, 15 Nov 2026. It adds the worked example and cross-check (T5c), the priced Sonda BOM (T5b) and the Gate 1 budget (T11)." }
            - note: "bom"
            - lead: { b: "E1 · The ask.", t: "Approve Gate 1: $25,538 over 12 weeks (AACE Class 5 range $12,769–$51,075). It covers:" }
            - ul:
                - "240 developer hours at the BLS median rate of $63.20/h, which comes to $15,168;"
                - "120 agronomist hours at $37.87/h, which comes to $4,544;"
                - "10 Sonda Pro engineering prototypes, $5,227;"
                - "hosting for 3 months, $73;"
                - "Gemini at its cost ceiling, $461;"
                - "10 SIMs with data, $65."
            - note: "bom"
            - p: "It buys a pilot with farmers in York, Nebraska and Buin, Chile; Sonda readings paired with SMAP and IMERG; and a baseline for every KPI. Hours are [DESIGN] quantities the team can change; every rate is sourced (T11)."
            - lead: { b: "E2 · Purpose.", t: "%{app_name} turns free NASA and public Earth data into one season plan per field. The farmer then runs that plan with their own people, machines, supplies and budget in the same app. [DESIGN]" }
            - lead: { b: "E3 · Why.", t: "There are at least 570 million farms; more than 475 million are under 2 ha [VERIFIED: FAO, Lowder et al. 2014]. Erosion removes 25–40 billion tonnes of topsoil a year and costs about 7.6 million tonnes of cereal a year [VERIFIED: FAO SWSR 2015 via ReliefWeb]. In the 2026 FAO assessment, 81% of regional assessments rate erosion management poor or very poor [VERIFIED (secondary): DevelopmentAid on FAO SWSR 2026]. Today the data that could help sits in research portals, and farm records sit in separate tools or on paper (BAU, T4)." }
            - lead: { b: "E4 · Why now.", t: "NASA point services (POWER, AppEEARS) now return per-field values with no GIS skills, and %{app_name} already uses nine NASA datasets in production [VERIFIED: docs/ROADMAP.md, checkpoint 2026-11-15]. LTE-M/GNSS modules cost about £19–23 each [VERIFIED: RS UK]. Language models can narrate computed facts under guardrails; %{app_name}'s Gemini narration is live with a daily cap of 2,000 requests [VERIFIED: ROADMAP.md]." }
            - lead: { b: "E5 · What.", t: "Preferred option (T4, Option B+C, staged): grow %{app_name} from a rotation comparator into an integrated season-execution platform, with the Sonda station as a gated hardware track. It beats BAU because it links the plan to the inputs that make it executable. It beats \"comparator only\" because a plan with no labour, machine or cost view stays advice. [DESIGN]" }
            - lead: { b: "E6 · How.", t: "" }
            - ul:
                - "Gate 1 (validate): pilot with real farmers in two languages; usability targets from the team's own plan (landing to Your plan in under 5 minutes; 4 of 5 new users reach it without help) [VERIFIED: team overview §17]."
                - "Gate 2 (operations core): People and Tasks, Equipment, Supplies, Season Execution Plan."
                - "Gate 3 (economics): costs, budgets, prices; gross margin as an eighth criterion."
                - "Hardware track: EVT, then DVT, then certification, then a 100-unit pilot batch."
                - "Accountable owner per gate: [UNKNOWN] (team names and roles are an open question in the overview)."
            - lead: { b: "E7 · Cost.", t: "Sonda unit bill of materials at 100 units, priced from distributors: Pro $493.73, Lite $316.96 (T5b). Soil, rain and air sensors are 74% of the Pro's cost, so the probe choice drives the price, not the electronics. Running cost: one e2-medium VM at $24.46 a month [VERIFIED (secondary): Economize]; connectivity about $1.15 per Pro device per month at A-1. Gate 1 total: $25,538 (E1)." }
            - note: "bom"
            - lead: { b: "E8 · Value, shown on a real field (T5c).", t: "Ames, Iowa, 2025 NASA POWER data run through %{app_name}'s own formulas:" }
            - ul:
                - "Corn needed 506 mm of water (FAO-56, with NASA POWER's measured wind) and effective rain covered 80%; soybean 73%. The model's 13% soybean cut for 2025 did not happen: Story County soybeans yielded 4.2% above trend (NASS). The 25-year backtest (T5d) shows the water model flags drought disasters but does not predict yield."
                - "The farmer's current corn–soybean rotation scores 82, ahead of a small-grain rotation (68) and a family change (60). The ranking holds under a steeper slope, without a harvester, and with no goals set. The app's own services give the same totals (docs/proposal/ames_cross_check.rb now computes them)."
                - "The risk it finds: 12 vulnerable bare months over three seasons on the FAO-56 calendar; a cover crop in each bare window cuts the count to 4. In soil terms (RUSLE) a rye cover saves about 13% of the yearly loss, because most erosive rain falls May to September, under young crops the timeline counts as cover (T5d, V6 and V8)."
                - "The 25-year backtest (T5d) scores eight of these claims against what happened on the field: the rotation advice is backed by 670 field trials (+9.9% corn yield after soybean) and the erosion ranking holds; five tests fail, each with a named cause and fix."
            - evidence: "See the backtest evidence"
            - p: "NPV and payback need the pilot's adoption data (G1)."
            - lead: { b: "E9 · Evidence status.", t: "Every figure in E1–E8 is either sourced or computed from sourced inputs by code in the repo; docs/proposal/claims_audit.rb recomputes 40 of them and fails if the text and the code disagree. 28 items remain open (T6), six of them raised by the backtest. Only pilot travel touches the Gate 1 budget. The three that matter most:" }
            - ul:
                - "whether farmers will log operations in the season plan (the pilot answers it);"
                - "the Sonda Pro's certification path, since a cellular device may need PTCRB and carrier approval;"
                - "%{app_name}'s open-source licence (no LICENSE file in the repo root yet)."
            - lead: { b: "E10 · Top risks.", t: "Scope creep into a generic farm-management tool; hardware cost and certification; coarse data misleading small fields; adoption; a small team. Owners and mitigations are in T14." }
            - lead: { b: "E11 · Kill criteria.", t: "Stop the operations modules if fewer than 3 of 10 pilot farmers use the season plan weekly after 6 weeks. Stop the hardware track if the DVT unit BOM exceeds the agreed price ceiling, or if Sonda readings cannot be paired with SMAP/IMERG for the same pin. Stop the program if no institutional partner signs a letter of intent by Gate 2. [DESIGN] thresholds; the team must set the final numbers (T18)." }
            - lead: { b: "E12 · Decision requested.", t: "Approve with conditions: Gate 1 only. Next gate review: [UNKNOWN] date, to be set by the team." }
        t1:
          title: "T1 · Problem and strategic rationale"
          blocks:
            - p: "Farmers have to make season decisions that hold up for years, and the evidence and the records they need are spread across many places. %{app_name}'s job is to bring them together."
            - h3: "Case for change"
            - ul:
                - "Scale. At least 570 million farms worldwide, more than 500 million family farms, and more than 475 million under 2 ha [VERIFIED: FAO ESA Working Paper 14-02, Lowder, Skoet, Singh 2014]. A later count gives 656 million farms in 2020 [VERIFIED: CIMMYT repository paper]."
                - "Soil loss. Erosion removes 25–40 billion t of topsoil a year. If nothing changes, cereal losses reach about 253 million t by 2050 [VERIFIED: FAO SWSR 2015 via ReliefWeb]. FAO put the possible yield loss at up to 10% by 2050 [VERIFIED: UN News]."
                - "Getting worse. The FAO Status of the World's Soil Resources 2026 was launched on 27 Aug 2026 and calls erosion the most severe threat [VERIFIED: FAO Global Soil Partnership]. 65% of assessments report a deteriorating trend since 2015 [VERIFIED (secondary): DevelopmentAid]."
                - "Access. The team's view is that NASA data \"lives in scientific portals, file formats and units built for researchers,\" and that small and medium farms often cannot pay agronomists [VERIFIED: team overview §3; a team claim, not yet measured]."
            - lead: { b: "Business as usual (fair version).", t: "BAU is not \"nothing\". Farmers rotate by habit and adviser input. Large farms buy commercial platforms (T7). Others keep records on paper or in spreadsheets, and extension offices give advice where they reach. BAU's weakness is the break between evidence (satellites, soil surveys) and execution (labour, machines, inputs, cash). BAU cost to the farmer: [UNKNOWN]; it needs pilot interviews." }
            - lead: { b: "Theory of change [DESIGN]:", t: "per-field NASA and soil evidence, plus farmer goals → a ranked rotation with exposed months flagged (built) → a season execution plan with tasks, machines, inputs and costs (vision) → the farmer runs it and records what happened (vision) → next season recomputes from real outcomes (partly built: \"Use as plan\" saves next season's crop [VERIFIED: docs/FIELDS.md]). The key untested assumption: farmers will record operations if the plan pre-fills them. Kill criterion K1 tests it." }
            - lead: { b: "Strategic fit.", t: "It answers every item in the challenge brief [VERIFIED: docs/ROADMAP.md, challenge requirements]. It also matches FAO's 2026 call for the adoption of sustainable soil management [VERIFIED: FAO GSP page]." }
        t2:
          title: "T2 · Objectives and success criteria"
          blocks:
            - p: "The objectives are outcomes for farmers, not features. Baselines are missing because no farmer has used %{app_name} yet, so every baseline is set during Gate 1."
            - table:
                caption: "Objectives O1 to O5"
                rows:
                  - ["#", "Objective (SMART)", "Baseline", "Target", "By", "Measured with"]
                  - ["O1", "New farmers get from landing to a usable plan quickly", "[UNKNOWN]", "under 5 min; 4 of 5 without help [VERIFIED: team overview §17]", "Gate 1", "Usability sessions, en and es"]
                  - ["O2", "Fewer exposed bare-soil months in the chosen plan", "Method run on Ames: 12 vulnerable months over 3 seasons, 4 with cover (T5c); NDVI shows the count misses May-June and Nov-Dec exposure (T5d, V8); pilot fields measured at enrolment", "[DESIGN] −50% against the current rotation", "1 season after Gate 1", "Rotations::Timeline exposed-month count; NDVI bare windows"]
                  - ["O3", "The plan is executed, not only read", "0 (module not built)", "[DESIGN] 3 of 10 pilot farmers log operations weekly", "Gate 2 + 6 weeks", "Task and operation logs"]
                  - ["O4", "The farmer can see the cost of each strategy", "0 (prices are always a gap [VERIFIED: docs/FIELDS.md])", "[DESIGN] cost per ha shown for all strategies in 2 countries", "Gate 3", "Budget module coverage"]
                  - ["O5", "Ground readings sit next to satellite readings", "0 (hardware not built)", "[DESIGN] 10 Sonda units paired with SMAP and IMERG for 60 days", "Hardware DVT", "device_readings beside the observations"]
        t3:
          title: "T3 · Scope"
          blocks:
            - lead: { b: "In scope (end goal):", t: "the eleven platform modules in T5 and the Sonda station (Lite and Pro) in T5b. Global coverage with richer US layers, two languages, web plus iOS and Android shells." }
            - lead: { b: "Out of scope until a later gate [DESIGN]:", t: "farm accounting and tax (Farmbrite and others already do this, T7); machine guidance and variable-rate prescriptions; livestock management beyond the profile list; payments and marketplaces; drones." }
            - lead: { b: "Interfaces:", t: "NASA POWER, AppEEARS, Earthdata, Planetary Computer, FAO GAEZ, SSURGO, USGS, CDL, Meteomatics, Gemini on Vertex [VERIFIED: docs/FIELDS.md, CLAUDE.md]. Planned: price, pest and nutrient sources already documented in docs/data_sources/ [VERIFIED: docs/DATA_SOURCES.md], and the Sonda ingestion API [VERIFIED: docs/DEVICES.md]." }
        t4:
          title: "T4 · Options analysis"
          blocks:
            - p: "The recommendation [DESIGN] is to build the integrated platform in stages (B) and to treat the Sonda (C) as a separate, gated track. Option A (lean on an existing open-source farm system for records) is the main alternative, and the team should choose between A and B at Gate 1."
            - lead: { b: "Longlist considered:", t: "BAU; do-minimum (keep the comparator only); A, comparator plus integration with farmOS for operations records; B, an integrated platform built in the current Rails app; C, B plus own hardware; D, license a commercial platform and add the NASA layer to it. D is dropped: no commercial platform's API terms were read [UNKNOWN], and it gives up the open-source and free-data objectives." }
            - table:
                caption: "Shortlisted options against the objectives"
                rows:
                  - ["Criterion", "BAU", "Do-minimum", "A · Comparator + farmOS", "B · Integrated platform (preferred)", "C · B + Sonda"]
                  - ["Meets O1 (fast plan)", "No", "Yes (built)", "Yes", "Yes", "Yes"]
                  - ["Meets O2 (fewer exposed months)", "No", "Partly: shows them, cannot track execution", "Yes, if farmers log in farmOS", "Yes", "Yes"]
                  - ["Meets O3 (plan executed)", "No", "No", "Yes, but across two apps", "Yes, in one app", "Yes"]
                  - ["Meets O4 (cost per strategy)", "No", "No", "Partly: farmOS logs carry no prices by default [UNKNOWN]", "Yes (Gate 3)", "Yes"]
                  - ["Meets O5 (ground vs satellite)", "No", "No", "farmOS has sensor support [VERIFIED: Drop Times project page]; pairing [UNKNOWN]", "No", "Yes"]
                  - ["Whole-life cost", "Farmer's time, advisers [UNKNOWN]", "$0 on credits [VERIFIED: docs/deploy/DEPLOY.md]; $24.46/month VM after (T11)", "Low build; Drupal hosting [UNKNOWN]", "Gate 1 $25,538 (T11); later gates priced at G1", "Highest: Sonda Pro BOM $493.73/unit, certification, connectivity"]
                  - ["Key risk", "Status quo erosion", "A plan that is never executed", "Two stacks, two logins, Drupal skills", "Scope creep into a generic farm-management tool", "Hardware cost and certification"]
                  - ["Evidence status", "Weak", "Strong (live)", "Medium", "Medium", "Weak (TRL 2)"]
            - note: "bom"
            - lead: { b: "Why B over A [DESIGN]:", t: "%{app_name}'s season data already lives in its own models (fields, crop zones, timeline months, observations) [VERIFIED: docs/DATA_MODEL.md, docs/FIELDS.md]. Tasks, machines and inputs need to hang off those same months and zones, which is easier in one data model. A stays the fallback if team capacity is the binding limit. farmOS is GPL and models equipment, maintenance logs and inventory [VERIFIED: farmos.org guide], so it is also a pattern to copy." }
            - lead: { b: "Why C is gated, not cancelled:", t: "the challenge rewards satellite-ground comparison, and the design is ready [VERIFIED: docs/DEVICES.md]. Hardware is the costliest and least mature part (TRL 2), so it only moves past EVT with pilot demand (T18)." }
            - lead: { b: "Switching values (what would flip the choice) [DESIGN]:", t: "if fewer than 3 of 10 pilot farmers log operations weekly, B falls back to do-minimum. If farmOS integration costs under half of B's build effort, A wins. If the Sonda Pro BOM goes above the price ceiling the team sets, C stops after EVT." }
        t5:
          title: "T5 · Technical design: the end-goal platform"
          blocks:
            - p: "The end goal is one season plan per field that every module reads from and writes to. Rotation, weather and satellite evidence decide what to grow. People, machines, supplies and money decide whether it can be done. Sensors and records show what actually happened. Six modules exist today, one is designed (the Sonda), and four are vision."
            - lead: { b: "The integrating idea: the Season Execution Plan [DESIGN].", t: "When a farmer taps \"Use as plan\" (built), %{app_name} expands the chosen strategy into a dated list of field operations for each crop zone: prepare, sow, fertilise, spray, irrigate, cover-crop, harvest. Each operation carries its window (from the timeline's months and the 7-day forecast), the machine it needs, the inputs and quantities, the people and hours, and its cost. Done operations are logged against the same zone, and the harvest closes the loop. Today the plan stores only next season's crop [VERIFIED: docs/FIELDS.md, Crops::PlanService]." }
            - h3: "%{app_name} end-goal architecture · 11 modules around one season plan"
            - figure: "Evidence on the left and resources on the right both meet in the season plan. Solid boxes are live today; dashed boxes are the Sonda and the four vision modules."
            - table:
                caption: "The eleven modules"
                rows:
                  - ["#", "Module", "Built today", "End goal [DESIGN]", "Main data and APIs", "Status"]
                  - ["1", "Land and Fields", "Pins, area, irrigation, water source, soil class; up to six crop zones on a 10×10 grid; field workspace [VERIFIED: docs/FIELDS.md, DATA_MODEL.md]", "Field boundaries (the boundary column is empty until a map exists [VERIFIED: DATA_MODEL.md]); tenure and lease terms; parcel documents; soil lab results", "SSURGO, 3DEP, NASADEM, CDL, GIBS, FCC", "Built, extend"]
                  - ["2", "Crops and Rotation Planner", "Current rotation plus 4 strategies, 7 criteria scored 0–100, 3-season timeline, scenarios (+1/+2 °C, −20% rain), Gemini \"why\" [VERIFIED: ROADMAP.md]", "Own yields recorded (needs a column [VERIFIED: FIELDS.md]); GEOGLAM crop calendars; gross margin as an 8th criterion", "GAEZ, ECOCROP, FAO-56, POWER, IMERG, SMAP, MODIS, ECOSTRESS, GRACE", "Built, extend"]
                  - ["3", "Weather and Risk", "7-day Meteomatics forecast; daily frost, heat, heavy-rain and dry-spell alerts; push and email wait for switches and the shells [VERIFIED: ROADMAP.md]", "Pest and disease weather rules; alerts tied to scheduled operations (\"spray window closes Thursday\")", "Meteomatics, POWER hourly; pest rules documented [VERIFIED: data_sources/pest_weather_rules.md]", "Built, extend"]
                  - ["4", "Field from Space", "Monthly NDVI (Landsat, Sentinel-2), MODIS normal, bare windows, NDVI map [VERIFIED: ROADMAP.md]", "Observed bare months against the planned timeline (listed as next [VERIFIED: ROADMAP.md]); anomaly alerts", "Planetary Computer, AppEEARS", "Built, extend"]
                  - ["5", "Reports and Sharing", "Season summary, GAEZ attainable harvest, CSV/JSON export [VERIFIED: FIELDS.md]", "Read-only plan link for an adviser or extension office; cooperative roll-ups", "Internal", "Built, extend"]
                  - ["6", "People and Tasks", "Profile fields only: role, team type, team size [VERIFIED: farmer_profile.rb]. \"Team members and tasks need their own models\" [VERIFIED: FIELDS.md]", "Several users per farm with roles (owner, manager, worker, advisor already exist as profile roles); tasks generated from the plan, assigned, timed; hours, wage rate, labour cost; workload score from real hours", "Passkeys per member (existing auth)", "Vision"]
                  - ["7", "Equipment and Machinery", "A checklist of 8 types: hand tools, draft animals, tractor, planter, sprayer, harvester, irrigation system, drone [VERIFIED: farmer_profile.rb]. The workload score counts a combine for small grains [VERIFIED: FIELDS.md]", "Asset registry (make, model, year, hours, location); maintenance logs and reminders; use per operation; fuel; ownership vs hire cost; strategies checked against machines actually owned", "Manual entry; machine-data import [UNKNOWN which standard]", "Vision"]
                  - ["8", "Supplies and Inputs", "Nothing", "Stock of seed, fertiliser, crop protection, fuel, cover-crop seed; consumption per operation; reorder points before a sowing window; nitrogen balance per zone", "Nutrient removal sources documented [VERIFIED: data_sources/nutrient_removal.md]", "Vision"]
                  - ["9", "Costs, Budget and Markets", "Nothing. Market prices are a gap in every strategy [VERIFIED: FIELDS.md]. The profile has budget level low/high [VERIFIED: DATA_MODEL.md]", "Cost per ha per strategy (inputs + machines + labour); price feeds; gross margin; monthly cash need on the timeline", "FAOSTAT, AMS, NASS, WFP, World Bank and others, with licence verdicts already checked [VERIFIED: DATA_SOURCES.md]; most keys not configured", "Vision"]
                  - ["10", "Field Station (Sonda)", "Catalogue page with a 3D viewer only [VERIFIED: DEVICES.md]", "Ground soil moisture, temperature and rain next to SMAP, IMERG, POWER; device card, alerts (T5b)", "POST /api/v1/devices/readings (to build)", "Designed"]
                  - ["11", "Integrations Hub", "13 sources fetched per field pin, all through one client with retries and an operator pause switch [VERIFIED: FIELDS.md]", "Sources as plug-ins with status per farm; credentials per source; partner exports (adviser, cooperative, farmOS)", "Index of about 60 documented sources [VERIFIED: docs/data_sources/]", "Built, extend"]
            - lead: { b: "Architecture fit.", t: "The current architecture absorbs the new modules without a rewrite [DESIGN]. Each module is one Rails area with service objects and Turbo screens, following the house rules (thin controllers, Result objects, every outside call through the switchboard) [VERIFIED: CLAUDE.md]. New tables follow the existing conventions (money as integer minor units or decimal(10,2), never Float; integer enums starting at unknown) [VERIFIED: DATA_MODEL.md]. Proposed new tables [DESIGN]: farm_members, tasks, operations, equipment_assets, maintenance_logs, supplies, stock_movements, cost_items, price_quotes, devices, device_readings (the last two are already specified [VERIFIED: DEVICES.md])." }
            - lead: { b: "Repo vs overview conflicts (logged as U-01 and U-02 in T6):", t: "the overview calls MODIS, ECOSTRESS and GRACE \"next\", but ROADMAP.md marks them done. FIELDS.md still lists AppEEARS products and FAO-56 as \"not connected yet\", which ROADMAP.md contradicts." }
        t5b:
          title: "T5b · Sonda field station: modules, cost, manufacturing"
          blocks:
            - p: "The Sonda is fully specified on paper (docs/DEVICES.md) but not yet built: only the catalogue page with a 3D viewer exists in production [VERIFIED: docs/DEVICES.md]. Roughly half of the core electronics have verified distributor unit prices, while soil probes, power components, enclosure mechanics and market-by-market certification paths remain open (U-07 to U-11, U-21, U-22). Consequently, no final unit BOM or retail price is stated at this Strategic Outline Case (SOC) stage. The station is designed as a single global product: the same hardware, firmware and backend serve any agricultural region, with only the connectivity variant (Lite or Pro) and the regulatory approvals differing by deployment market."
            - h3: "1. Expected end-to-end operation [DESIGN] + [VERIFIED: docs/DEVICES.md]"
            - p: "The Sonda operates as an autonomous agrometeorological field station that turns subsoil and microclimate measurements into actionable decisions inside %{app_name}'s season plan. Operation follows four stages:"
            - ul:
                - "Field setup (once, about 2 minutes). The farmer mounts the weatherproof enclosure on a post inside the target crop zone and buries two capacitive soil probes at 10 cm (seedbed and evaporation zone) and 30 cm (active root zone). Scanning the exterior QR label in the %{app_name} app validates a one-time claim token and binds the hardware (device_id) to the field pin or crop zone [VERIFIED: docs/DEVICES.md]."
                - "Edge acquisition (every 15 minutes). Powered by a 5 W solar panel and a LiFePO4 battery, the station stays in deep sleep and is woken by the RV-3028 real-time clock to sample soil moisture and temperature at 10 and 30 cm, air temperature and relative humidity (SHT45), plus cumulative rainfall and solar radiation on the Pro model [VERIFIED: docs/DEVICES.md]. Each sample is written to a 16 MB SPI NOR flash buffer with a monotonically increasing sequence number (seq) and an RTC timestamp, so no data is lost during multi-day WiFi or cellular outages [VERIFIED: docs/DEVICES.md]. Timestamps are stored in UTC and converted to local time from the field's location, so the same firmware runs in any time zone [DESIGN]."
                - "Secure telemetry (every 60 minutes). The Sonda batches pending readings, signs the batch inside its ATECC608B secure element (ECDSA P-256) and uploads it over TLS through local WiFi (Lite) or LTE-M/NB-IoT with a soldered multi-carrier eSIM (Pro) [VERIFIED: docs/DEVICES.md]. Flash is freed only up to the highest seq acknowledged by the server [VERIFIED: docs/DEVICES.md]."
                - "Cloud pairing and action (continuous). Readings are ingested through POST /api/v1/devices/readings, validated (signature, seq, clock skew ≤ 10 min) and plotted side by side with NASA SMAP, IMERG, POWER and Meteomatics series in the \"Your sensor next to the satellite\" view [VERIFIED: docs/DEVICES.md]. When readings cross agronomic thresholds (water stress, rainfall that makes a planned irrigation unnecessary, frost, heat or disease risk), %{app_name} updates tasks in the Season Execution Plan and sends alerts [DESIGN]."
            - table:
                caption: "Figure T5b-1 · Sonda end-to-end flow in four stages"
                rows:
                  - ["Stage", "Cadence", "Key operations and data flow"]
                  - ["Stage 1 · Field Setup", "Once (~2 min)", "Post mount in crop zone; bury 10 cm and 30 cm capacitive probes; scan QR label in the %{app_name} app to bind device_id to field pin or zone"]
                  - ["Stage 2 · Edge Acquisition", "Every 15 min", "RV-3028 RTC wakes ESP32-S3; sample soil (10/30 cm) and SHT45 air T/RH; write to 16 MB SPI NOR flash buffer with monotonic seq and UTC timestamp"]
                  - ["Stage 3 · Secure Telemetry", "Every 60 min", "Batch pending samples; sign in ATECC608B (ECDSA P-256); upload over TLS via WiFi (Lite) or LTE-M/NB-IoT with soldered eSIM (Pro); free flash up to server ACK"]
                  - ["Stage 4 · Cloud Pairing & Action", "Continuous", "Ingest via POST /api/v1/devices/readings; validate signature, seq and clock skew ≤ 10 min; store in device_readings; pair against SMAP, IMERG, POWER and Meteomatics; update Season Execution Plan and send alerts"]
            - h3: "2. Scientific rationale: closing the satellite-to-ground gap [DESIGN]"
            - p: "Earth observation datasets give %{app_name} global, zero-cost coverage, but their spatial resolution, sensing depth and revisit time leave blind spots at the field-zone scale. The Sonda is designed to ground-truth and downscale four data streams already active in %{app_name} [VERIFIED: docs/ROADMAP.md, docs/DEVICES.md]:"
            - table:
                caption: "What each satellite source misses at field scale, and what the Sonda measures"
                rows:
                  - ["Variable", "Satellite / gridded source", "Limitation at field scale", "Sonda measurement"]
                  - ["Soil moisture", "NASA SMAP (~9–36 km)", "Senses only the top ~5 cm of soil", "Capacitive moisture and temperature at 10 cm and 30 cm [VERIFIED: docs/DEVICES.md], validating root-zone water where SMAP cannot see"]
                  - ["Precipitation", "NASA IMERG (~0.1°, ~10 km)", "Can miss localized convective rainfall", "0.2 mm tipping-bucket rain gauge, Pro only [VERIFIED: docs/DEVICES.md], separating rain from irrigation at field level"]
                  - ["Microclimate", "NASA POWER (~50 km); Meteomatics (~1–9 km)", "Grid cells average out local frost pockets, slopes and canopy effects", "On-site air T/RH (SHT45), solar radiation (Pro) and optional leaf wetness [VERIFIED: docs/DEVICES.md], driving frost, heat-stress and pest/disease rules (pest_weather_rules.md)"]
                  - ["Crop water stress", "NASA ECOSTRESS (~70 m)", "Intermittent overpasses leave temporal gaps", "Continuous 15-minute soil and air time series [VERIFIED: docs/DEVICES.md], filling gaps between overpasses for irrigation timing"]
            - h3: "3. Hardware architecture: Lite vs. Pro [VERIFIED: docs/DEVICES.md]"
            - p: "Both variants share a common solar-powered, weatherproof core and differ only in backhaul connectivity, positioning and meteorological expansion:"
            - ul:
                - "Common core platform (Lite and Pro): 5 W solar panel → MPPT charger → LiFePO4 battery → regulated rails; Espressif ESP32-S3-WROOM-1 MCU (WiFi 2.4 GHz + BLE); Microchip ATECC608B secure element (ECDSA P-256); 16 MB SPI NOR flash buffer; RV-3028 RTC; IP67 UV-stabilised polycarbonate enclosure with vent, M12 sealed probe connectors and pole mount. Samples every 15 minutes and uploads hourly in batches."
                - "Sonda Lite: for fields within reach of a local WiFi network. Uses WiFi 2.4 GHz plus Bluetooth for local setup, inherits its geolocation from the field pin in the %{app_name} app, and carries the base sensor set (soil at 10 and 30 cm, air T/RH)."
                - "Sonda Pro: for remote fields that depend on cellular IoT coverage. Adds a Quectel BG95-M3 module (LTE-M / NB-IoT with built-in GNSS), a soldered MFF2 multi-carrier eSIM, a 0.2 mm tipping-bucket rain gauge, a solar radiation sensor and an SDI-12 / RS485 expansion port."
            - table:
                caption: "Figure T5b-2 · Hardware architecture: common core, Sonda Lite and Sonda Pro"
                rows:
                  - ["Subsystem", "Common core platform", "Sonda Lite", "Sonda Pro"]
                  - ["Power", "5 W solar panel → MPPT charger → LiFePO4 battery → regulated rails", "Included", "Included"]
                  - ["Compute and security", "ESP32-S3-WROOM-1 MCU + ATECC608B (ECDSA P-256)", "Included", "Included"]
                  - ["Storage and time", "16 MB SPI NOR flash buffer + RV-3028 RTC with backup", "Included", "Included"]
                  - ["Base sensors", "2× capacitive soil moisture/temperature probes (10 and 30 cm) + SHT45 air T/RH", "Included", "Included"]
                  - ["Enclosure and mount", "IP67 UV-stabilised polycarbonate, vent, M12 connectors, pole mount", "Included", "Included"]
                  - ["Backhaul and positioning", "Variant-specific", "WiFi 2.4 GHz + BLE; location from field pin in app", "BG95-M3 LTE-M / NB-IoT + built-in GNSS; MFF2 soldered eSIM"]
                  - ["Weather and bus expansion", "Variant-specific", "None (base soil and air sensing only)", "0.2 mm rain gauge, solar radiation sensor, SDI-12 / RS485 port"]
                  - ["Target deployment", "Variant-specific", "Fields with local WiFi coverage", "Remote fields with cellular IoT coverage"]
            - h3: "4. Hardware modules and unit costs normalized in USD (BOM status)"
            - p: "Distributor quotes in other currencies are normalized to USD with fixed reference rates ([ASSUMPTION A-3]: 1 GBP = 1.27 USD; 1 EUR = 1.08 USD), keeping the original verified list price in parentheses. All prices exclude VAT, sales taxes, import duties and freight; landed cost varies by destination market and is not estimated at this stage. \"Qty 100\" is the 100-unit price break."
            - table:
                caption: "Hardware modules and unit costs (BOM status)"
                rows:
                  - ["Block / subsystem", "Part (as designed)", "Lite", "Pro", "Unit (Qty 1)", "Batch (Qty 100)", "Evidence"]
                  - ["MCU, WiFi + BLE", "Espressif ESP32-S3-WROOM-1-N8R8", "Yes", "Yes", "$5.82 (£4.58)", "$4.39 (£3.46)", "[VERIFIED: DigiKey UK]"]
                  - ["Cellular + GNSS", "Quectel BG95-M3 (BG95M3LA-64-SGNS)", "No", "Yes", "$29.60 (£23.31)", "$24.66 (£19.42)", "[VERIFIED: RS UK]"]
                  - ["Secure element", "Microchip ATECC608B-SSHDA-B", "Yes", "Yes", "$0.86 (€0.796)", "$0.69 (€0.642)", "[VERIFIED: Farnell IE]"]
                  - ["Air temperature + humidity", "Sensirion SHT45-AD1F-R2", "Yes", "Yes", "$4.10 (€3.80)", "$3.70 (€3.43)", "[VERIFIED: SOS electronic]"]
                  - ["Embedded SIM", "MFF2 soldered eSIM", "No", "Yes", "$0.70", "$0.70", "[VERIFIED: Telnyx pricing]"]
                  - ["Rain gauge (0.2 mm/tip)", "Tipping-bucket collector; final SKU open", "No", "Yes", "$150.00 (benchmark)", "[UNKNOWN]", "[VERIFIED: NovaLynx store]"]
                  - ["Soil moisture + temperature (×2)", "Capacitive, never resistive; SKU open (U-07)", "Yes", "Yes", "[UNKNOWN]", "[UNKNOWN]", "Research-grade benchmark: $218 each [VERIFIED: METER TEROS 11]"]
                  - ["Offline buffer", "16 MB SPI NOR flash (U-08)", "Yes", "Yes", "[UNKNOWN]", "[UNKNOWN]", "Not yet quoted"]
                  - ["Real-time clock", "RV-3028 RTC + backup (U-08)", "Yes", "Yes", "[UNKNOWN]", "[UNKNOWN]", "Not yet quoted"]
