      steps:
        location:
          question: "¿Dónde está tu finca?"
          aluni: Marca un punto en el mapa. Con eso ya puedo leer el clima, el suelo y la pendiente de tu zona sin preguntarte nada de eso.
        found:
          question: Esto es lo que encontré
          aluni: 'Revisa estos datos de tu zona. Tú conoces tu tierra mejor que un satélite: si algo no coincide, cámbialo.'
        boundary:
          question: "¿Cómo es este terreno?"
          aluni: Dibuja el contorno si puedes y calculo el área. Si no, basta con el punto y me dices cuánto mide.
        crop:
          question: "¿Qué tienes sembrado ahora?"
          aluni: 'Lo que siembras hoy es el punto de partida: con eso comparo otras rotaciones.'
        history:
          question: "¿Qué sembraste antes?"
          aluni: Con los últimos tres años veo si se repite una familia de cultivos, que es cuando más se acumulan las plagas.
        water:
          question: "¿Cómo riegas?"
          aluni: Así sé cuánta agua puede pedir un cultivo antes de sugerírtelo.
        inputs:
          question: "¿Cuánto fertilizante usas?"
          aluni: Basta con una idea general. Si usas poco, las leguminosas te rinden más.
        resources:
          question: "¿Con qué cuentas para trabajar?"
          aluni: No te voy a sugerir algo que no puedas sembrar o cosechar con lo que tienes.
        market:
          question: "¿Dónde vendes tu cosecha?"
          aluni: Un cultivo sin comprador no es buena opción, por mucho que mejore el suelo.
        goals:
          question: "¿Qué es lo más importante para ti?"
          aluni: Elige hasta tres, en orden. Así ordeno las opciones que te muestro.
        done:
          question: Revisa y guarda
          aluni: Esto es lo que me contaste. Guárdalo y preparo tu terreno.
