        fallow: Un terreno en descanso recupera suelo. Un cultivo de cobertura lo mantiene protegido y suma materia orgánica para la próxima temporada.
        stalk: Alternar este cultivo con una leguminosa corta el ciclo de plagas del suelo. Un cultivo de cobertura después de la cosecha protege la tierra en invierno.
        grain: Los cereales pequeños cubren pronto el suelo y cortan el ciclo de plagas del maíz y la soya. Su paja suma materia orgánica.
