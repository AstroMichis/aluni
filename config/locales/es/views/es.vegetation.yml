    vegetation:
      eyebrow: Landsat y Sentinel-2
      title: Tu campo desde el espacio
      map:
        label: "Tu terreno desde arriba, coloreado según qué tan verde estaba el %{date}"
        caption: "NDVI del %{date} (%{mission}), sobre imagen satelital. Una escena, píxeles de 10 a 30 m."
        toggle: Mostrar u ocultar el NDVI
        attribution: "NDVI: %{mission} vía Microsoft Planetary Computer. %{credit}"
        credits:
          sentinel-2: "Contiene datos modificados de Copernicus Sentinel %{year}"
          landsat: "Landsat por cortesía del U.S. Geological Survey"
        failed: No se pudo cargar el mapa. El gráfico de arriba tiene los mismos meses.
      missions:
        sentinel-2: Sentinel-2
        landsat: Landsat
      normal_key: "Lo habitual del mes (%{years} años, MODIS)"
      normal_point: "Suele estar en %{ndvi} este mes."
      normal_below: "Frente a su verde habitual (NASA MODIS, desde 2001), tu punto estuvo bastante por debajo en %{months}. Si no lo planeaste, vale la pena revisarlo."
      normal_usual: Frente a su verde habitual (NASA MODIS, desde 2001), tu punto siguió su ritmo normal este año.
      lede: Cuánta vegetación tuvo el punto de tu campo cada mes del último año (NDVI), medido por satélite.
      chart_label: Vegetación mensual de los últimos 12 meses
      month: "%{month}: NDVI %{ndvi}, %{cover}"
      month_unknown: "%{month}: sin imagen despejada"
      covers:
        green: Verde
        sparse: Escasa
        bare: Suelo descubierto
        unknown: Sin imagen
      bare_window: "Tu suelo estuvo descubierto %{months} meses seguidos, de %{from} a %{to}. Esa es la ventana para un cultivo de cobertura: protege el suelo de la erosión, retiene agua y suma materia orgánica."
      covered: Tu campo tuvo cobertura casi todo el año, sin períodos largos de suelo descubierto.
      about_title: "¿Qué es el NDVI?"
      about: "El NDVI compara la luz roja y la infrarroja que refleja la superficie. Las plantas sanas reflejan mucho infrarrojo: por encima de 0,45 hay un cultivo cerrado y creciendo; por debajo de 0,25 se ve sobre todo suelo o rastrojo. Es un pixel de 10 a 30 m en tu pin: describe ese punto, no todo el campo, y las nubes pueden dejar meses sin dato."
      source: "Fuente: %{missions}, mediante Microsoft Planetary Computer."
