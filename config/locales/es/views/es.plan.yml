        open_questions:
          title: "Preguntas abiertas para el equipo (antes de la postulación)"
          blocks:
            - checklist:
                - "U-01 / U-02: confirmar en producción qué conjuntos de datos de la NASA están activos y luego alinear el resumen, FIELDS.md y esta propuesta."
                - "U-03: elegir una licencia y agregar un archivo LICENSE."
                - "U-04: nombres, roles y horas de cada integrante; quién es responsable de cada gate."
                - "U-23: fechas para G1 y la primera gate de hardware."
                - "Elegir entre la Opción A (comparador + farmOS) y la Opción B (construir módulos de operaciones en Rails) para WP2, o postergarlo hasta el spike de G1."
                - "Fijar el precio tope de la Sonda Lite contra el que se evalúa K3."
                - "Confirmar o cambiar cada umbral [DESIGN] en T2, T9 y T18."
                - "U-25: aprobar la incorporación de un sensor de mojado foliar a la Sonda Pro (un anemómetro solo si los sitios piloto muestran que el viento de POWER no es preciso)."
                - "U-26: poner valores reales de NASS, AMS e ISU/ERS en docs/proposal/ames_inputs.json y volver a ejecutar el ejemplo práctico."
                - "U-27 a U-32: decidir qué correcciones del backtest (T5d) entran en WP1."
