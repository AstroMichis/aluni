        t18:
          title: "T18 · Criterios de cierre"
          blocks:
            - p: "Se acuerdan antes de empezar el trabajo, para que decida la evidencia y no la inercia. Los umbrales son [DESIGN] y el equipo debe confirmarlos."
            - table:
                caption: "Criterios de cierre"
                rows:
