                caption: "Requisitos de cumplimiento"
                rows:
                  - ["Requisito", "Autoridad", "Estado", "Plazo", "Riesgo si no se cumple"]
                  - ["Licencia de código abierto para el repositorio", "Equipo", "No hay archivo LICENSE en la raíz del repositorio (U-03)", "Horas", "La afirmación \"código abierto\" no es legalmente cierta"]
                  - ["Licencias de datos y atribución", "Cada proveedor", "Veredictos registrados por fuente; fuentes no comerciales excluidas [VERIFIED: DATA_SOURCES.md]", "Continuo", "Retiro de contenido o incumplimiento de redistribución"]
                  - ["Certificación de radio, EE. UU.", "FCC Part 15", "No iniciada", "3–16 semanas; hasta 6–9 meses con PTCRB [VERIFIED (secondary): MarkReady]", "No se puede vender la Sonda"]
                  - ["Certificación de radio, Chile y UE", "SUBTEL; CE/RED", "[UNKNOWN] (U-10)", "[UNKNOWN]", "No se puede pilotear la Pro en Buin"]
                  - ["Privacidad de datos agrícolas y personales", "Ley de EE. UU. y Chile", "Passkeys, cifrado de Active Record, exportación a CSV/JSON implementados [VERIFIED: CLAUDE.md, team overview §11]; obligaciones legales [UNKNOWN] (U-19)", "[UNKNOWN]", "Confianza y cumplimiento"]
                  - ["Publicación en tiendas de apps", "Apple, Google", "Apps contenedoras construidas, no enviadas [VERIFIED: team overview §10]", "Tiempos de revisión [UNKNOWN]", "Sin alertas push en los teléfonos"]
        t16:
          title: "T16 · Gobernanza y derechos de decisión"
          blocks:
            - p: "Una persona debe ser responsable de cada gate. Hoy no hay ningún responsable nombrado (U-04, U-23). RACI propuesto [DESIGN]:"
            - table:
                caption: "RACI"
                rows:
                  - ["Decisión", "Líder de producto", "Ingeniería", "Líder de hardware", "Socio agronómico", "Equipo (todos)"]
