test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Cloudflare R2 through the S3 adapter. Files are proxied through the app
# (config.active_storage.resolve_model_to_route = :rails_storage_proxy), so the
# bucket stays private. Credentials r2.* with ENV fallbacks; bucket from R2_BUCKET.
cloudflare_r2:
  service: S3
  endpoint: https://<%= Rails.application.credentials.dig(:r2, :account_id) || ENV["R2_ACCOUNT_ID"] %>.r2.cloudflarestorage.com
  access_key_id: <%= Rails.application.credentials.dig(:r2, :access_key_id) || ENV["R2_ACCESS_KEY_ID"] %>
  secret_access_key: <%= Rails.application.credentials.dig(:r2, :secret_access_key) || ENV["R2_SECRET_ACCESS_KEY"] %>
  region: auto
  bucket: <%= ENV.fetch("R2_BUCKET", "aluni") %>
  force_path_style: true
  request_checksum_calculation: "when_required"
  response_checksum_validation: "when_required"
