# Action Cable over Redis in development and production (one REDIS_URL shared
# with Sidekiq, the cache store and Rack::Attack); the test adapter in test.
development:
  adapter: redis
  url: <%= ENV["REDIS_URL"].presence || "redis://localhost:6379/1" %>
  channel_prefix: aluni_development

test:
  adapter: test

production:
  adapter: redis
  url: <%= ENV["REDIS_URL"].presence || Rails.application.credentials.dig(:redis, :url) %>
  channel_prefix: aluni_production
