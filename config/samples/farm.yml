# The preview farm behind /menu/fields: the snapshot farm_data.py wrote for
# 42.00, -93.75 (near Ames, Iowa) plus what a sample farmer would tell Aluni.
# Only `answers` and `confirmed` are made up; every measured value comes from
# the snapshot. Field names live in fields.sample.<key>. Loaded by
# Fields::SampleFarm; keys must exist in config/field_profile.yml.
snapshot: farm_data_42.0_-93.75.json
# The daily series farm_data.py writes next to the snapshot (long format:
# source,variable,value,unit,date,lat,lon), read by Weather::Season.
series: farm_data_42.0_-93.75.csv
layer: us

answers:
  location: "42.00, -93.75"
  water_access: rainfed
  water_source: [rain]
  fertilizer_level: medium
  team: family
  machinery: [tractor, planter, sprayer]
  livestock: [none]
  market_channels: [elevator, cooperative]
  no_market_crops: [vegetables]
  goals: [soil, erosion, income]
  tech_level: intermediate
  units: metric
confirmed: [season_weather]

fields:
  # The point the snapshot was taken at: parcel data come from it.
  north:
    snapshot: true
    answers: { boundary: drawn, area: 32.4, current_crop: corn, planting_month: "5", harvest_month: "10", yield: 11.2 }
    confirmed: [crop_history, soil_type]
  # No snapshot here yet: its parcel data show as pending.
  creek:
    answers: { boundary: drawn, area: 18.1, current_crop: soybeans, crop_history: { 2023: corn, 2024: soybeans, 2025: soybeans }, yield: 3.4 }
  # Just added: a pin, no crop yet (the empty field in the sketch).
  home:
    answers: { boundary: pin, area: 6.2 }

# What the sample farmer plans next, their team, its tasks and the alerts
# they want. Task titles of the sample live in staff.sample_tasks.<title_key>.
plans: { north: soybeans }
team:
  - { id: m1, name: "Ana Ruiz", role: manager, fields: [north, creek, home] }
  - { id: m2, name: "Luis Pérez", role: worker, fields: [north] }
tasks:
  - { id: t1, title_key: scout, field: north, member: m2, due: "2026-11-18", done: false }
  - { id: t2, title_key: soil_sample, field: creek, member: m1, due: "2026-11-25", done: false }
  - { id: t3, title_key: cover_crop, field: home, member: m1, due: "2026-11-02", done: true }
alerts: [frost, heat, heavy_rain, dry_spell]
