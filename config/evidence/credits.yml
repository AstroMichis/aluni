# Every external data source, API, method and library Aluni uses, with its APA 7 reference, what is read,
# how, why, the licence and the attribution its provider asks for. The public /credits page (CreditsController)
# renders it; the words around it are in config/locales/{en,es}/views/*.credits.yml.
# Checked by docs/proposal/credits_audit.rb:
#   offline  every external host in the code maps to an entry here; every `code` match is really in that file
#            (so "what is used" is proven against the code); every attribution is shown where it must be
#   --online (Luis runs it; no web from Claude) each DOI is resolved at doi.org in APA style and compared with `apa`;
#            each NASA product's DOI is read from NASA CMR by short name and version and compared with `doi`
#
# Fields
#   name, licence_kind (nasa_open, public_domain, copernicus, cc_by, odbl, bsd, mit, ofl, copyright, terms, unknown)
#   attribution_at  map: the credit must show on the map or image itself; otherwise the /credits page carries it
#   group      nasa | data | method | service | software
#   used_in    app (aluni.us), backtest (docs/proposal/validation), or both
#   apa        the reference, APA 7th edition; `verify: true` marks a reference not yet confirmed against its DOI or provider
#   cmr        NASA CMR short_name and version, for the --online DOI check
#   code       [file, text that must appear in it]: where it is used, and the proof of the product, version or parameters
#   hosts      the hosts the code calls for it
#   licence    as read in docs/data_sources/*.md or the provider's terms; UNKNOWN where no grant was found
#   attribution.required  the wording the provider asks for (nil when none is asked)
#   attribution.shown     [file, text] where the app shows it; empty = not shown (a GAP when required)

nasa_power:
  name: NASA POWER
  group: nasa
  licence_kind: nasa_open
  used_in: both
  apa: "NASA Langley Research Center. (2025). Prediction Of Worldwide Energy Resources (POWER) Project: Daily, hourly and climatology API (Version 2) [Data set]. https://power.larc.nasa.gov/"
  verify: true
  what: "Daily T2M, T2M_MIN, T2M_MAX, PRECTOTCORR, GWETROOT for the season so far; climatology (monthly normals) of T2M, T2M_MIN, T2M_MAX, PRECTOTCORR, FROST_DAYS, RH2M, WS2M, ALLSKY_SFC_SW_DWN; the cell's elevation. Community AG, 0.5 x 0.625 degree cells. Backtest: the same daily parameters 2001-2025 plus WS2M, RH2M, ALLSKY, and hourly T2M, RH2M for the pest rules."
  how: "NasaPower::Client GET /api/temporal/daily/point and /climatology/point at the pin, no key, through the data switchboard; Fields::FetchObservationsJob on every pin and weekly (Fields::RefreshObservationsJob). Backtest: validation/fetch.rb."
  why: "Weather card, growing degree days and frost (Weather::Season), FAO-56 reference evapotranspiration (Weather::Et0) for every crop's water need, the climate scenarios, the pest scouting windows."
  code:
    - [app/services/nasa_power/client.rb, "power.larc.nasa.gov/api/temporal/"]
    - [app/services/nasa_power/client.rb, "T2M T2M_MIN T2M_MAX PRECTOTCORR GWETROOT"]
    - [app/services/nasa_power/client.rb, "FROST_DAYS RH2M WS2M ALLSKY_SFC_SW_DWN"]
    - [docs/proposal/validation/fetch.rb, "hourly/point"]
  hosts: [power.larc.nasa.gov]
  licence: "NASA open data, no restrictions on use"
  attribution:
    required: "These data were obtained from the NASA Langley Research Center (LaRC) POWER Project funded through the NASA Earth Science/Applied Science Program."
    must_include: "POWER Project"
    shown: []

