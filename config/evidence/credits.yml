    - [app/services/nasa_power/client.rb, "IMERG_PRECTOT"]
    - [app/jobs/fields/fetch_observations_job.rb, "imerg_daily"]
  hosts: [power.larc.nasa.gov]
  licence: "NASA open data, no restrictions on use"
  attribution:
    required: "Cite the dataset DOI (NASA Earthdata data use guidance)."
    must_include: "IMERG"
    shown: []

