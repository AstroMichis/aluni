  group: nasa
  licence_kind: nasa_open
  used_in: app
  apa: "Wiese, D. N., Yuan, D.-N., Boening, C., Landerer, F. W., & Watkins, M. M. (2023). JPL GRACE and GRACE-FO Mascon Ocean, Ice, and Hydrology Equivalent Water Height Coastal Resolution Improvement (CRI) Filtered Release 06.3 Version 04 [Data set]. NASA Physical Oceanography DAAC. https://doi.org/10.5067/TEMSC-3JC634"
