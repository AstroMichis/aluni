# The crops the screens recognise, keyed like FieldCrop#crop_key (the slug
# of the scientific name). Per crop:
#   scientific  the ECOCROP / botanical name (config/ecocrop.yml uses it)
#   aliases     common names in English and Spanish (slugs), to match a
#               FieldCrop saved without a scientific name
#   family      botanical family, for the rotation rules (standard botany;
#               ECOCROP's FAMNAME agrees once config/ecocrop.yml exists)
#   shape       the plant the illustrated field draws (stalk, grain, leafy, bush)
#   gaez        the crop name in FAO GAEZ v4 res05 (docs/data_sources/gaez.md), or null
#   fao56       crop coefficients for its water need, only where
#               docs/data_sources/fao56_crop_coefficients.md captured them:
#               kc [initial, mid, end] (Table 12; a blank initial takes the
#               group row), stages [initial, development, mid, late] days and
#               the planting month (Table 11, the row named in `row`)
# Loaded by Crops::Agronomy.
