version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rails:
        patterns: ["rails", "action*", "active*", "railties"]
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: cargo
    directory: "/vendor/gems/aluni_core"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
