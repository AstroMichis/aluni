name: Platform switch

# Pause or resume an outside service from GitHub (works from the phone app).
# Runs the platform rake tasks (lib/tasks/platform.rake) inside the running
# web container on the GCP VM. Same access path as deploy.yml: keyless
# Workload Identity Federation (main only), SSH over IAP with a pinned host key.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [status, pause, resume, pause_all, resume_all, bootstrap]
        default: status
      service:
        description: Service (for pause/resume)
        type: choice
        options: ["", jobs, cron, gemini, mail, push, meteomatics, planetary_computer]
        default: ""
      reason:
        description: Reason (optional)
        type: string
        default: ""

concurrency:
  group: platform-switch

permissions:
  contents: read
  id-token: write # GitHub OIDC token for Workload Identity Federation

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      GCP_PROJECT: astromichis-aluni
      GCP_ZONE: us-central1-a
      GCP_VM: aluni-vm
      KAMAL_HOST: aluni-vm
      KAMAL_SSH_USER: deploy
      KAMAL_REGISTRY_SERVER: us-central1-docker.pkg.dev
      KAMAL_REGISTRY_USERNAME: oauth2accesstoken
      KAMAL_IMAGE: astromichis-aluni/aluni/aluni
      APP_DOMAIN: aluni.us
      KAMAL_TUNNEL: "1"
      KAMAL_BACKUP: "0"
      ACTIVE_STORAGE_SERVICE: local
      INPUT_ACTION: ${{ inputs.action }}
      INPUT_SERVICE: ${{ inputs.service }}
      INPUT_REASON: ${{ inputs.reason }}
      PLATFORM_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign in to Google Cloud (OIDC, no key)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/865393748299/locations/global/workloadIdentityPools/github/providers/aluni-repo
          service_account: github-deployer@astromichis-aluni.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
      - name: Install Kamal (version from Gemfile.lock)
        run: gem install kamal --no-document -v "$(sed -n 's/^    kamal (\(.*\))$/\1/p' Gemfile.lock)"

      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.KAMAL_SSH_KEY }}

      - name: SSH to the VM through IAP
        env:
          KAMAL_KNOWN_HOSTS: ${{ secrets.KAMAL_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KAMAL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host aluni-vm
            User deploy
            StrictHostKeyChecking yes
            ProxyCommand gcloud compute start-iap-tunnel $GCP_VM 22 --listen-on-stdin --zone=$GCP_ZONE --project=$GCP_PROJECT --verbosity=warning
          EOF
          chmod 600 ~/.ssh/config ~/.ssh/known_hosts
          ssh aluni-vm true

      # `app exec --reuse` runs in the web container already up, so no image
      # pull and no app secrets are needed on the runner.
      - name: Run platform task
        run: |
          case "$INPUT_ACTION" in
            pause|resume)
              [ -n "$INPUT_SERVICE" ] || { echo "Pick a service for $INPUT_ACTION"; exit 1; }
              # Strip characters that would break rake's [args] syntax.
              reason=$(printf '%s' "$INPUT_REASON" | tr -cd '[:alnum:] ._-')
              task="platform:${INPUT_ACTION}[${INPUT_SERVICE},${reason}]" ;;
            *)
              task="platform:${INPUT_ACTION}" ;;
          esac
          actor=$(printf '%s' "$PLATFORM_ACTOR" | tr -cd '[:alnum:]._-')
          kamal app exec --reuse --roles=web "env PLATFORM_ACTOR=$actor bin/rails '$task'"
