name: Deploy

# Kamal deploy to the GCP VM on every push to main (and by hand). Runs in
# parallel with CI: a failing test suite does not block the deploy, and Kamal's
# health check on /up keeps the previous version serving if the new one does
# not boot.
#
# No long-lived Google key: the runner signs in with Workload Identity
# Federation (GitHub OIDC token), which GCP accepts only from this repository
# (by numeric id, so it survives a transfer) on refs/heads/main. The service
# account can push images to Artifact Registry, open IAP tunnels and read the
# VM, nothing else. SSH to the VM goes through IAP; port 22 is not open to
# the internet.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # GitHub OIDC token for Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Secrets live in the "production" environment, limited to main.
    environment: production
    env:
      GCP_PROJECT: astromichis-aluni
      GCP_ZONE: us-central1-a
      GCP_VM: aluni-vm
      KAMAL_HOST: aluni-vm
      KAMAL_SSH_USER: deploy
      KAMAL_ARCH: amd64
      KAMAL_BUILDER_REMOTE: ssh://aluni-vm
      KAMAL_REGISTRY_SERVER: us-central1-docker.pkg.dev
      KAMAL_REGISTRY_USERNAME: oauth2accesstoken
      KAMAL_IMAGE: astromichis-aluni/aluni/aluni
      APP_DOMAIN: aluni.us
      KAMAL_TUNNEL: "1"
      KAMAL_BACKUP: "0"
      ACTIVE_STORAGE_SERVICE: local
      GEMINI_BACKEND: vertex
      GOOGLE_CLOUD_PROJECT: astromichis-aluni
      GOOGLE_CLOUD_LOCATION: global
      SIGNUPS_ENABLED: ${{ vars.SIGNUPS_ENABLED || '1' }}
      PLATFORM_PAUSE_ALL: ${{ vars.PLATFORM_PAUSE_ALL || '0' }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      SIDEKIQ_WEB_USERNAME: ${{ secrets.SIDEKIQ_WEB_USERNAME }}
      SIDEKIQ_WEB_PASSWORD: ${{ secrets.SIDEKIQ_WEB_PASSWORD }}
      TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY }}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY }}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT }}
      METEOMATICS_USERNAME: ${{ secrets.METEOMATICS_USERNAME }}
      METEOMATICS_PASSWORD: ${{ secrets.METEOMATICS_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign in to Google Cloud (OIDC, no key)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/865393748299/locations/global/workloadIdentityPools/github/providers/aluni-repo
          service_account: github-deployer@astromichis-aluni.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Only Kamal is needed here: the image (and the Rust extension) is built
      # on the VM, so the app's own gems are never installed on the runner.
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
      - name: Install Kamal (version from Gemfile.lock)
        run: gem install kamal --no-document -v "$(sed -n 's/^    kamal (\(.*\))$/\1/p' Gemfile.lock)"

      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.KAMAL_SSH_KEY }}

      # Both Kamal (net-ssh) and the remote Docker builder read ~/.ssh/config,
      # so the IAP tunnel is set up once here. The VM's host key is pinned:
      # a spoofed server cannot receive the deploy.
      - name: SSH to the VM through IAP
        env:
          KAMAL_KNOWN_HOSTS: ${{ secrets.KAMAL_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KAMAL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host aluni-vm
            User deploy
            StrictHostKeyChecking yes
            ProxyCommand gcloud compute start-iap-tunnel $GCP_VM 22 --listen-on-stdin --zone=$GCP_ZONE --project=$GCP_PROJECT --verbosity=warning
          EOF
          chmod 600 ~/.ssh/config ~/.ssh/known_hosts
          ssh aluni-vm true

      - name: Registry token (1 hour)
        run: |
          token="$(gcloud auth print-access-token)"
          echo "::add-mask::$token"
          echo "KAMAL_REGISTRY_PASSWORD=$token" >> "$GITHUB_ENV"

      - name: Kamal deploy
        run: kamal deploy
