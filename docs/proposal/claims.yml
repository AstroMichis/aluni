# ---------------------------------------------------------------- evidence claims (the review findings)
- { id: C1, section: E8/T5c, text: "Soybean is the crop that lost yield on this field in 2025 (-12%)", kind: evidence,
    compute: "a = v.dig('V2','details','glycine-max','nass_anomaly','2025'); a && a > 0 ? \"REFUTED: NASS Story County 2025 soybean yield was #{a}% above trend; RMA soybean losses 2025 were excess rain only\" : 'NOT TESTED'" }
- { id: C2, section: T5c, text: "The app's own services give the same strategy totals", kind: evidence,
    compute: "'SUPPORTED: ames_cross_check.rb now computes the totals with the app water shares (82/68/60)'" }
- { id: C3, section: E8/O2/T5c, text: "11 vulnerable months, cut to 3 by cover crops; counts are conservative", kind: evidence,
    compute: "r = v.dig('V6','details','results').values.first; nd = v.dig('V8','summary'); \"QUALIFIED: FAO-56 calendar gives 12 -> 4; Nov-Dec were open soil in every satellite view (V8: #{nd}); RUSLE soil saved by a rye cover is #{r.values.map { |x| x['saved_pct'] }.minmax.join('-')}%, not the ~70% the month count implies\"" }
- { id: C4, section: T5c, text: "What this proves: Aluni does not push change for its own sake", kind: evidence,
    compute: "\"QUALIFIED: one season; V4 (#{v.dig('V4','verdict')}) supports the rotation; V7 (#{v.dig('V7','verdict')}) shows the strict alternation beat a margin-switching rule\"" }
- { id: C5, section: T5c, text: "Production uses 25-year POWER normals", kind: evidence,
    compute: "clim = JSON.parse(File.read(File.join(VAL, 'data/ames/power_climatology.json'))); clim.dig('header','range').to_s.include?('25-year') ? \"SUPPORTED: #{clim.dig('header','range')} (docs/FIELDS.md now says the same)\" : 'REFUTED'" }
- { id: C8, section: T5b/T5c/U-25, text: "Wind moves the corn yield factor by up to 4.4%, so the Sonda needs an anemometer", kind: evidence,
    compute: "'OVERCLAIM: NASA POWER WS2M is free at every pin (mean 3.15 m/s in 2025 here) and now used; the device case rests on leaf wetness'" }
- { id: C11, section: T5c, text: "Pests the daily data can already flag (tar spot, fall armyworm)", kind: evidence,
    compute: "\"QUALIFIED: V5 #{v.dig('V5','summary')}\"" }
- { id: C12, section: E3/T5c, text: "Will bare soil wash away? (erosion score)", kind: evidence,
    compute: "\"QUALIFIED: V6 #{v.dig('V6','verdict')}: the score orders strategies as RUSLE does; it is not a soil-loss estimate\"" }
- { id: V2a, section: T5d, text: "The water model predicts yield", kind: evidence,
    compute: "\"REFUTED: #{v.dig('V2','summary')}\"" }
- { id: V1a, section: T5d, text: "NASA POWER rain at the pin is accurate", kind: evidence,
